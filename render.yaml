services:
  - type: web
    name: cuadradito-superviviente-ekareal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOWED_ORIGINS
        value: https://ekarealoficial.github.io,http://localhost:3000
