          }
          state.darts.splice(i, 1);
          i--;
          continue;
        } else {
          if (targetIsBoss) {
            if (state.boss) {
              state.boss.hp -= 1 * state.playerDamageMult;
              state.boss.hitFlash = 0.12;
              if (state.boss.hp <= 0) killBoss();
            }
          } else {
            const idx = state.enemies.indexOf(d.target);
            if (idx !== -1) {
              d.target.hp -= 1 * state.playerDamageMult;
              d.target.hitFlash = 0.12;
              if (d.target.hp <= 0) killEnemy(idx);
            }
          }
          spawnParticles(d.x, d.y, 5, '#fbbf24', 0.6);
          Sfx.play('hit', 25);
          d.target = null;
          const next = getNearestTarget(d.x, d.y);
          let nextDist2 = Infinity;
          if (next) nextDist2 = (next.x - d.x)**2 + (next.y - d.y)**2;
          if (next && nextDist2 < 450*450) { d.target = next; d.state = 'hunt'; }
          else d.state = 'return';
        }
      }
    } else if (d.state === 'return') {
      const ang = Math.atan2(p.y - d.y, p.x - d.x);
      d.angle = ang;
      d.x += Math.cos(ang) * 550 * dt;
      d.y += Math.sin(ang) * 550 * dt;
      const ddx = d.x - p.x, ddy = d.y - p.y;
      if (ddx*ddx + ddy*ddy < 45*45) d.state = 'follow';
    }
  }
}

function reflectBulletOffWall(b, w) {
  const distLeft   = Math.abs(b.x - w.x);
  const distRight  = Math.abs(b.x - (w.x + w.w));
  const distTop    = Math.abs(b.y - w.y);
  const distBottom = Math.abs(b.y - (w.y + w.h));
  const minD = Math.min(distLeft, distRight, distTop, distBottom);
  if (minD === distLeft) { b.x = w.x - b.r - 1; b.vx = -Math.abs(b.vx); }
  else if (minD === distRight) { b.x = w.x + w.w + b.r + 1; b.vx = Math.abs(b.vx); }
  else if (minD === distTop) { b.y = w.y - b.r - 1; b.vy = -Math.abs(b.vy); }
  else { b.y = w.y + w.h + b.r + 1; b.vy = Math.abs(b.vy); }
}

/* =============== RENDER =============== */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#08080f';
  ctx.fillRect(0, 0, W, H);
  let sx = 0, sy = 0;
  if (state.shake > 0.2) {
    sx = (Math.random() * 2 - 1) * state.shake;
    sy = (Math.random() * 2 - 1) * state.shake;
  }
  const cam = state.cam;
  ctx.save();
  ctx.translate(W/2 + sx, H/2 + sy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  const visW = W / cam.zoom, visH = H / cam.zoom;
  const left = cam.x - visW/2, right = cam.x + visW/2;
  const top = cam.y - visH/2, bottom = cam.y + visH/2;
  const gs = 60;
  const gx0 = Math.floor(left/gs)*gs, gx1 = Math.ceil(right/gs)*gs;
  const gy0 = Math.floor(top/gs)*gs, gy1 = Math.ceil(bottom/gs)*gs;
  ctx.strokeStyle = 'rgba(70,110,255,0.08)';
  ctx.lineWidth = 1 / cam.zoom;
  ctx.beginPath();
  for (let x = gx0; x <= gx1; x += gs) { ctx.moveTo(x + 0.5, gy0); ctx.lineTo(x + 0.5, gy1); }
  for (let y = gy0; y <= gy1; y += gs) { ctx.moveTo(gx0, y + 0.5); ctx.lineTo(gx1, y + 0.5); }
  ctx.stroke();

  if (state.arena) {
    const a = state.arena;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 50, 100, 0.7)';
    ctx.shadowColor = '#ff2255'; ctx.shadowBlur = 25;
    ctx.lineWidth = 6;
    ctx.strokeRect(a.x, a.y, a.w, a.h);
    ctx.shadowBlur = 0;
    ctx.setLineDash([15, 10]);
    ctx.lineDashOffset = -state.time * 40;
    ctx.strokeStyle = 'rgba(255, 100, 150, 0.6)';
    ctx.lineWidth = 3;
    ctx.strokeRect(a.x + 8, a.y + 8, a.w - 16, a.h - 16);
    ctx.setLineDash([]);
    ctx.restore();
  }

  for (const w of currentWalls) {
    if (w.isArena) continue;
    ctx.fillStyle = '#1a2340';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = 'rgba(90,140,255,0.35)';
    ctx.lineWidth = 2 / cam.zoom;
    ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    ctx.fillStyle = 'rgba(70,110,200,0.18)';
    ctx.fillRect(w.x + 6, w.y + 6, w.w - 12, 4);
    ctx.fillRect(w.x + 6, w.y + w.h - 10, w.w - 12, 4);
  }

  const p = state.player;

  for (const ls of state.lightningStrikes) {
    const a = clamp(ls.timer / ls.maxTimer, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = '#fde047'; ctx.shadowBlur = 30;
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 4;
    ctx.beginPath();
    let x = ls.x + rand(-8, 8), y = ls.y - 500;
    ctx.moveTo(x, y);
    for (let s = 1; s <= 8; s++) {
      x = ls.x + rand(-15, 15);
      y = ls.y - 500 + (s/8) * 500;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(253,224,71,0.3)';
    ctx.beginPath(); ctx.arc(ls.x, ls.y, 80*(1-a) + 20, 0, TAU); ctx.fill();
    ctx.restore();
  }

  for (const pot of state.potions) {
    const blink = pot.life < 5 && Math.floor(pot.life * 8) % 2 === 0;
    if (blink) continue;
    const bobY = Math.sin(pot.bob) * 4;
    const cx = pot.x, cy = pot.y + bobY;
    const isLarge = pot.type === 'large';
    const s = isLarge ? 13 : 9;
    ctx.save();
    ctx.shadowColor = isLarge ? '#ff5ba0' : '#ff9ec4'; ctx.shadowBlur = 20;
    ctx.fillStyle = isLarge ? '#ff5ba0' : '#ff9ec4';
    ctx.beginPath(); ctx.arc(cx, cy, s, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(cx - s*0.3, cy - s*0.3, s*0.35, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - s*0.4, cy - 1.5, s*0.8, 3);
    ctx.fillRect(cx - 1.5, cy - s*0.4, 3, s*0.8);
    ctx.restore();
  }

  for (const o of state.orbs) {
    const pulse = 1 + Math.sin(o.pulse) * 0.15;
    ctx.save();
    ctx.shadowColor = '#8fff9e'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#c8ffd2';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * pulse, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // Enemigos
  for (const e of state.enemies) {
    const r = e.size / 2;
    ctx.save();
    ctx.shadowColor = e.color; ctx.shadowBlur = 18;
    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    if (e.type === 'shooter') {
      const a = Math.atan2(p.y - e.y, p.x - e.x);
      ctx.save();
      ctx.translate(e.x, e.y); ctx.rotate(a);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(r - 4, -3, 14, 6);
      ctx.restore();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(e.x - r*0.4, e.y); ctx.lineTo(e.x + r*0.4, e.y);
      ctx.moveTo(e.x, e.y - r*0.4); ctx.lineTo(e.x, e.y + r*0.4);
      ctx.stroke();
    } else if (e.type === 'invoker') {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.7, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.25, 0, TAU); ctx.fill();
      for (let k = 0; k < 4; k++) {
        const a = (k/4)*TAU + e.wob;
        ctx.beginPath(); ctx.arc(e.x + Math.cos(a)*r*0.85, e.y + Math.sin(a)*r*0.85, 3, 0, TAU); ctx.fill();
      }
    } else if (e.type === 'teleporter') {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
      const a1 = e.wob, a2 = e.wob + Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(a1)*r*0.6, e.y + Math.sin(a1)*r*0.6);
      ctx.lineTo(e.x - Math.cos(a1)*r*0.6, e.y - Math.sin(a1)*r*0.6);
      ctx.moveTo(e.x + Math.cos(a2)*r*0.6, e.y + Math.sin(a2)*r*0.6);
      ctx.lineTo(e.x - Math.cos(a2)*r*0.6, e.y - Math.sin(a2)*r*0.6);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.2, 0, TAU); ctx.fill();
    } else if (e.type === 'kamikaze') {
      const pulse = 0.7 + Math.sin(state.time*20)*0.3;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.35*pulse, 0, TAU); ctx.fill();
      for (let k = 0; k < 6; k++) {
        const a = (k/6)*TAU + e.wob;
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(a)*r*0.7, e.y + Math.sin(a)*r*0.7);
        ctx.lineTo(e.x + Math.cos(a)*r, e.y + Math.sin(a)*r);
        ctx.stroke();
      }
    } else if (e.type === 'dardante') {
      const activeCount = state.enemyDarts.filter(d => d.owner === e).length;
      const readyCount = Math.max(0, 4 - activeCount);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.5, 0, TAU); ctx.stroke();
      for (let k = 0; k < readyCount; k++) {
        const a = (k/4)*TAU + e.wob * 1.5;
        const dx = e.x + Math.cos(a) * (r + 8);
        const dy = e.y + Math.sin(a) * (r + 8);
        ctx.save();
        ctx.translate(dx, dy); ctx.rotate(a + Math.PI/2);
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.moveTo(0, -6); ctx.lineTo(-3, 4); ctx.lineTo(3, 4);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.25, 0, TAU); ctx.fill();
    } else if (e.type === 'juggernaut') {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.7, 0, TAU); ctx.stroke();
      if (e.jState === 'charging') {
        const ratio = 1 - (e.jTimer / 0.75);
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r*0.7, -Math.PI/2, -Math.PI/2 + ratio*TAU);
        ctx.stroke();
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.3*Math.sin(state.time * 20);
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.jAngle) * 900, e.y + Math.sin(e.jAngle) * 900);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.35, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.15, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.65, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath(); ctx.arc(e.x, e.y, r*0.28, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(e.x - r*0.3, e.y - r*0.3, r*0.22, 0, TAU); ctx.fill();
    }
    ctx.restore();
    if (e.maxHp > 2) {
      const w = e.size, hp = e.hp / e.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(e.x - w/2, e.y - r - 12, w, 5);
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x - w/2, e.y - r - 12, w * hp, 5);
    }
  }

  // Boss
  if (state.boss) {
    const b = state.boss;
    for (const ball of b.balls) {
      if (ball.state === 'attached') {
        ctx.strokeStyle = 'rgba(255, 100, 130, 0.55)';
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(ball.x, ball.y); ctx.stroke();
        ctx.save();
        ctx.shadowColor = '#ff2255'; ctx.shadowBlur = 25;
        ctx.fillStyle = '#ff5577';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, TAU); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(ball.x - ball.r*0.3, ball.y - ball.r*0.3, ball.r*0.35, 0, TAU); ctx.fill();
        ctx.restore();
      } else {
        ctx.save();
        ctx.shadowColor = '#ff2255'; ctx.shadowBlur = 30;
        ctx.fillStyle = '#ff7788';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, TAU); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 0.5, 0, TAU); ctx.stroke();
        ctx.restore();
      }
    }
    const r = b.size / 2;
    if (b.state === 'dash_windup') {
      ctx.save();
      ctx.globalAlpha = 0.4 + 0.3 * Math.sin(state.time * 30);
      ctx.strokeStyle = '#ffdd00'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(b.dashAngle) * 1000, b.y + Math.sin(b.dashAngle) * 1000);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.shadowColor = '#ff2255'; ctx.shadowBlur = 60;
    ctx.fillStyle = b.hitFlash > 0 ? '#ffffff' : '#a01030';
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff2255';
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.78, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(b.x, b.y); ctx.rotate(state.time * 1.5);
    ctx.strokeStyle = '#ffccdd'; ctx.lineWidth = 5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(0, 0, r * (0.3 + i*0.15), 0, TAU); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#ffdddd';
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.25, 0, TAU); ctx.fill();
    ctx.strokeStyle = b.phase === 1 ? '#ff2255' : (b.phase === 2 ? '#ff7700' : '#ff0000');
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r + 16, -Math.PI/2, -Math.PI/2 + (b.hp/b.maxHp) * TAU);
    ctx.stroke();
    ctx.restore();
  }

  for (const bomb of state.bossBombs) {
    if (bomb.exploded) {
      const a = 1 - bomb.fadeTimer / 0.6;
      if (a > 0) {
        ctx.save();
        ctx.globalAlpha = a * 0.6;
        ctx.fillStyle = '#ff8c42';
        ctx.beginPath(); ctx.arc(bomb.x, bomb.y, 100 * (1 - a*0.5), 0, TAU); ctx.fill();
        ctx.restore();
      }
      continue;
    }
    const pulse = 1 + Math.sin(state.time * 15) * 0.15;
    ctx.save();
    ctx.shadowColor = '#ff8c42'; ctx.shadowBlur = 15;
    ctx.fillStyle = bomb.timer < 1 ? '#ffdd00' : '#ff8c42';
    ctx.beginPath(); ctx.arc(bomb.x, bomb.y, bomb.r * pulse, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath();
    const ang = state.time * 6;
    ctx.moveTo(bomb.x, bomb.y);
    ctx.lineTo(bomb.x + Math.cos(ang) * bomb.r, bomb.y + Math.sin(ang) * bomb.r);
    ctx.stroke();
    ctx.restore();
  }

  for (const ls of state.bossLasers) {
    const length = 3000;
    const x1 = ls.x, y1 = ls.y;
    const x2 = ls.x + Math.cos(ls.angle) * length;
    const y2 = ls.y + Math.sin(ls.angle) * length;
    if (ls.state === 'warmup') {
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.3 * Math.sin(state.time * 20);
      ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3;
      ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    } else {
      const a = ls.active / 1.6;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 40;
      ctx.strokeStyle = '#ff3366'; ctx.lineWidth = ls.width;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = ls.width * 0.4;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
    }
  }

  for (const d of state.enemyDarts) {
    ctx.save();
    ctx.translate(d.x, d.y); ctx.rotate(d.angle);
    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-4, -4); ctx.lineTo(-4, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Balas jugador
  ctx.save();
  for (const b of state.bullets) {
    if (b.dupli > 0) { ctx.shadowColor = '#ff4dd2'; ctx.shadowBlur = 16; ctx.fillStyle = '#ffd1f0'; }
    else if (b.homing) { ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 16; ctx.fillStyle = '#e9d5ff'; }
    else if (b.drone) { ctx.shadowColor = '#4dff88'; ctx.shadowBlur = 14; ctx.fillStyle = '#d9ffe3'; }
    else { ctx.shadowColor = '#9ef7ff'; ctx.shadowBlur = 14; ctx.fillStyle = '#eaffff'; }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    if (b.bounces > 0) {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(251,191,36,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 2, 0, TAU); ctx.stroke();
    }
    if (b.homing) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#a855f7';
      const orbA = state.time * 10;
      ctx.beginPath(); ctx.arc(b.x + Math.cos(orbA)*(b.r + 2), b.y + Math.sin(orbA)*(b.r + 2), 1.8, 0, TAU); ctx.fill();
    }
    if (b.dupli > 0) {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.5, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();

  // Balas enemigas
  ctx.save();
  for (const b of state.enemyBullets) {
    ctx.shadowColor = '#ff8c42'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd0a8';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.restore();

  // Drones
  if (!state.over) {
    for (const d of state.drones) {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.save();
      ctx.rotate(d.angle);
      ctx.shadowColor = '#4dff88'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#d9ffe3';
      ctx.fillRect(8, -2, 10, 4);
      ctx.restore();
      ctx.shadowColor = '#4dff88'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#4dff88';
      ctx.fillRect(-8, -8, 16, 16);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.fillRect(-3, -3, 6, 6);
      ctx.fillStyle = '#4dff88';
      for (let i = 0; i < d.lines; i++) ctx.fillRect(-8 + i*4, -13, 3, 3);
      ctx.restore();
    }
  }

  // Dardos jugador
  if (!state.over) {
    for (const d of state.darts) {
      ctx.save();
      ctx.translate(d.x, d.y); ctx.rotate(d.angle + Math.PI/2);
      if (d.type === 'explosive') {
        ctx.shadowColor = '#fb7185'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#fecdd3';
      } else {
        ctx.shadowColor = '#fcd34d'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#fcd34d';
      }
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(-5, 6); ctx.lineTo(5, 6);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = d.type === 'explosive' ? '#fb7185' : '#fff';
      ctx.beginPath(); ctx.arc(0, 2, 2, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  // Escudos
  if (!state.over) {
    for (const sh of state.shields) {
      const hpRatio = sh.hp / sh.maxHp;
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 16;
      ctx.strokeStyle = 'rgba(77,243,255,0.85)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = hpRatio > 0.5 ? '#4df3ff' : (hpRatio > 0.25 ? '#fbbf24' : '#ef4444');
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(0, 0, 12, -Math.PI/2, -Math.PI/2 + hpRatio*TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(77,243,255,0.4)';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  // LÁSER: CARGA
  if (state.laserCharging) {
    const t = state.laserChargeTime;
    const width = 20 + t * 25;
    const range = 2000;
    const angle = p.angle;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(angle);
    const alpha = 0.15 + Math.min(0.5, t * 0.1);
    ctx.fillStyle = `rgba(255,80,120,${alpha})`;
    ctx.shadowColor = '#ff3366'; ctx.shadowBlur = 30;
    ctx.fillRect(0, -width / 2, range, width);
    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.6})`;
    ctx.fillRect(0, -width * 0.15, range, width * 0.3);
    ctx.restore();

    const auraR = p.size / 2 + 10 + width * 0.4;
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 20);
    ctx.save();
    ctx.strokeStyle = `rgba(255,80,120,${0.5 + Math.min(0.5, t * 0.05)})`;
    ctx.lineWidth = 2 + Math.min(6, t * 0.5);
    ctx.shadowColor = '#ff3366'; ctx.shadowBlur = 20 + Math.min(60, t * 5);
    ctx.beginPath(); ctx.arc(p.x, p.y, auraR, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,150,180,${0.4 * pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, auraR * 0.75, 0, TAU); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff5577';
    ctx.shadowColor = '#ff3366'; ctx.shadowBlur = 15;
    ctx.fillText(t.toFixed(1) + 's  ·  ' + Math.round(width) + 'px', p.x, p.y - p.size / 2 - 50);
    ctx.restore();
  }

  // Rayos activos
  for (const lf of state.lasersFiring) {
    for (let k = 0; k < lf.count; k++) {
      const angle = p.angle + lf.sweep + (k / lf.count) * TAU;
      const range = 2000;
      const x2 = p.x + Math.cos(angle) * range;
      const y2 = p.y + Math.sin(angle) * range;
      const w = lf.width;
      ctx.save();
      ctx.shadowColor = '#ff3366'; ctx.shadowBlur = 60;
      ctx.strokeStyle = 'rgba(255,80,120,0.85)';
      ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = Math.max(3, w * 0.35);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,180,220,0.5)';
      ctx.lineWidth = Math.max(1, w * 0.15);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
    }
  }

  // Jugador
  if (!state.over) {
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 60) {
      for (let i = 1; i <= 3; i++) {
        const t = i * 0.045;
        ctx.globalAlpha = 0.18 / i;
        ctx.fillStyle = p.dashTimer > 0 ? '#22d3ee' : '#4df3ff';
        ctx.fillRect(p.x - p.vx*t - p.size/2, p.y - p.vy*t - p.size/2, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }
    const blink = p.invuln > 0 && Math.floor(p.invuln * 18) % 2 === 0;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.save();
    ctx.rotate(p.angle);
    ctx.shadowColor = p.dashTimer > 0 ? '#22d3ee' : '#4df3ff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#d9fdff';
    ctx.fillRect(p.size/2 - 6, -4, 18, 8);
    if (p.backShots > 0) {
      ctx.fillStyle = '#c77dff'; ctx.shadowColor = '#c77dff';
      ctx.fillRect(-p.size/2 - 12, -4, 18, 8);
    }
    ctx.restore();
    ctx.shadowColor = p.dashTimer > 0 ? '#22d3ee' : '#4df3ff';
    ctx.shadowBlur = 22;
    ctx.fillStyle = blink ? 'rgba(77,243,255,0.25)' : (p.dashTimer > 0 ? '#22d3ee' : '#4df3ff');
    const h = p.size / 2;
    ctx.fillRect(-h, -h, p.size, p.size);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-5, -5, 10, 10);
    ctx.restore();
  }

  for (const pt of state.particles) {
    const a = clamp(pt.life / pt.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  for (const f of state.floats) {
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state.flash > 0) {
    ctx.fillStyle = `rgba(${state.flashRGB},${state.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (!state.over && state.halfHearts <= 2) {
    const pulse = 0.22 + 0.16 * Math.sin(state.time * 6);
    const grad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
    grad.addColorStop(0, 'rgba(255,0,40,0)');
    grad.addColorStop(1, `rgba(255,0,40,${pulse})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD();
  if (state.cardChoices) drawCards();
  if (state.inventoryOpen) drawInventory();
  if (state.over) drawGameOver();
  drawCrosshair();
}

function drawCrosshair() {
  const x = mouse.x, y = mouse.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#4df3ff';
  ctx.shadowColor = '#4df3ff';
  ctx.shadowBlur = 10;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-18, 0); ctx.lineTo(-7, 0);
  ctx.moveTo(18, 0); ctx.lineTo(7, 0);
  ctx.moveTo(0, -18); ctx.lineTo(0, -7);
  ctx.moveTo(0, 18); ctx.lineTo(0, 7);
  ctx.stroke();
  ctx.fillStyle = '#4df3ff';
  ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, TAU); ctx.fill();
  ctx.restore();
}

/* =============== HUD =============== */
function heartPath(cx, cy, s) {
  const x = cx, y = cy - s*0.5, t = s*0.3;
  ctx.beginPath();
  ctx.moveTo(x, y + t);
  ctx.bezierCurveTo(x, y, x - s/2, y, x - s/2, y + t);
  ctx.bezierCurveTo(x - s/2, y + (s + t)/2, x, y + (s + t)/2, x, y + s);
  ctx.bezierCurveTo(x, y + (s + t)/2, x + s/2, y + (s + t)/2, x + s/2, y + t);
  ctx.bezierCurveTo(x + s/2, y, x, y, x, y + t);
  ctx.closePath();
}
function drawHeart(cx, cy, s, halves) {
  heartPath(cx, cy, s);
  ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,90,120,0.55)'; ctx.stroke();
  if (halves <= 0) return;
  ctx.save();
  heartPath(cx, cy, s); ctx.clip();
  if (halves === 1) { ctx.beginPath(); ctx.rect(cx - s, cy - s, s, s*3); ctx.clip(); }
  heartPath(cx, cy, s);
  ctx.fillStyle = '#ff3b6b'; ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = 14;
  ctx.fill();
  ctx.restore();
}
function drawHUD() {
  const hearts = Math.ceil(state.maxHalfHearts / 2);
  let s = 28, gap = 12;
  let totalW = hearts * s + (hearts - 1) * gap;
  if (totalW > W - 120) {
    gap = 6;
    s = Math.max(16, (W - 120 - (hearts - 1) * gap) / hearts);
    totalW = hearts * s + (hearts - 1) * gap;
  }
  let hx = W / 2 - totalW / 2 + s / 2;
  for (let i = 0; i < hearts; i++) {
    drawHeart(hx, 34, s, clamp(state.halfHearts - i * 2, 0, 2));
    hx += s + gap;
  }

  const xpW = 240, xpH = 10;
  const xpX = W / 2 - xpW / 2, xpY = 62;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(xpX, xpY, xpW, xpH);
  ctx.fillStyle = '#8fff9e';
  ctx.fillRect(xpX, xpY, xpW * clamp(state.xp / state.xpNeeded, 0, 1), xpH);
  ctx.strokeStyle = 'rgba(143,255,158,0.6)'; ctx.lineWidth = 1.5;
  ctx.strokeRect(xpX, xpY, xpW, xpH);

  ctx.save();
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('NIVEL ' + state.level, W / 2, xpY + 14);
  ctx.restore();

  ctx.save();
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('PUNTOS  ' + state.score, 24, 22);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('BAJAS  ' + state.kills + '   ·   TIEMPO  ' + state.time.toFixed(1) + 's', 24, 48);

  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText(
    'Daño x' + state.playerDamageMult.toFixed(2) +
    '   ·   Enemigos x' + state.enemyHpMult.toFixed(2) +
    '   ·   Spawn x' + state.spawnRateMult.toFixed(2) +
    (state.player.regenLevel > 0 ? '   ·   Regen: ' + state.player.regenInterval.toFixed(0) + 's' : '') +
    (state.player.greedLevel > 0 ? '   ·   Codicia: ' + (state.player.greedLevel * 15) + '%' : ''),
    24, 70);
  if (state.player.laserCount > 0) {
    ctx.fillStyle = 'rgba(255,80,120,0.8)';
    ctx.fillText('Láser: ' + state.player.laserCount + '  (mantén clic para cargar, suelta para disparar)', 24, 88);
  }
  ctx.restore();

  // ==== SLOTS (esquina) con info de cargas y cooldown ====
  const slotSize = 52;
  const slotGap = 8;
  const slotY = H - 76;
  const slotStartX = 24;
  for (let i = 0; i < 5; i++) {
    const sx = slotStartX + i * (slotSize + slotGap);
    const cardId = state.slots[i];
    const card = cardId ? SPECIAL_CARDS.find(c => c.id === cardId) : null;
    const sc = card ? state.specialCards[cardId] : null;

    // Fondo
    ctx.save();
    ctx.fillStyle = card ? 'rgba(30, 25, 60, 0.95)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(sx, slotY, slotSize, slotSize);
    ctx.strokeStyle = card ? card.color : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, slotY, slotSize, slotSize);

    // Número de tecla (top-left)
    ctx.fillStyle = card ? '#fff' : 'rgba(255,255,255,0.35)';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText((i + 1), sx + 4, slotY + 3);

    if (card && sc) {
      // Icono (centro)
      const iconX = sx + slotSize/2;
      const iconY = slotY + slotSize/2 - 2;
      ctx.fillStyle = card.color;
      ctx.beginPath(); ctx.arc(iconX, iconY, 12, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.name[0], iconX, iconY + 1);

      // Cargas (bottom, texto "X/Y")
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(sc.charges + '/' + sc.maxCharges, sx + slotSize/2, slotY + slotSize - 3);

      // Overlay cooldown si recargando
      if (sc.charges < sc.maxCharges) {
        // Fondo oscuro
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(sx + 2, slotY + 2, slotSize - 4, slotSize - 4);
        // Tiempo restante
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(Math.ceil(sc.cooldown) + 's', sx + slotSize/2, slotY + slotSize/2 - 2);
        // Arco de progreso
        const ratio = 1 - sc.cooldown / sc.cooldownMax;
        ctx.strokeStyle = card.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sx + slotSize/2, slotY + slotSize/2, slotSize/2 - 3, -Math.PI/2, -Math.PI/2 + ratio * TAU);
        ctx.stroke();
        // Volver a dibujar cargas para que se vean encima
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = 'bold 9px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(sc.charges + '/' + sc.maxCharges, sx + slotSize/2, slotY + slotSize - 3);
      }
    } else {
      // Slot vacío: solo número grande centrado
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((i + 1), sx + slotSize/2, slotY + slotSize/2 + 4);
    }
    ctx.restore();
  }
  // Etiqueta "E: inventario"
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('E: inventario', slotStartX, slotY - 6);
  ctx.restore();

  // Indicador de regeneración
  if (state.player.regenLevel > 0 && state.halfHearts < state.maxHalfHearts) {
    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(74, 222, 128, 0.8)';
    ctx.fillText('❤ Regen en ' + Math.max(0, state.player.regenTimer).toFixed(1) + 's', W - 24, 70);
    ctx.restore();
  }

  // Indicador de thunder rain
  if (state.thunderRain.active) {
    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(253, 224, 71, 0.95)';
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 12;
    ctx.fillText('⚡ Lluvia: ' + state.thunderRain.timer.toFixed(1) + 's', W - 24, 92);
    ctx.restore();
  }

  if (state.boss) {
    const bw = Math.min(W - 100, 600);
    const bx = (W - bw) / 2;
    const by = 100;
    const bh = 22;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
    ctx.fillStyle = '#3a0010';
    ctx.fillRect(bx, by, bw, bh);
    const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    grad.addColorStop(0, '#ff2255');
    grad.addColorStop(1, '#ff7700');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, bw * (state.boss.hp / state.boss.maxHp), bh);
    ctx.strokeStyle = '#ff5577'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.5, by); ctx.lineTo(bx + bw * 0.5, by + bh);
    ctx.moveTo(bx + bw * 0.33, by); ctx.lineTo(bx + bw * 0.33, by + bh);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('JEFE  (FASE ' + state.boss.phase + ')', W / 2, by - 6);
  }

  ctx.save();
  ctx.font = '13px system-ui, sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillText('WASD mover  ·  RATÓN apuntar  ·  CLIC disparar  ·  1-5 skills  ·  E inventario', W - 24, 24);
  ctx.restore();
}

/* =============== INVENTARIO =============== */
const SLOT_W = 100, SLOT_H = 120, SLOT_GAP = 16;
const INV_CARD_W = 280, INV_CARD_H = 70, INV_CARD_GAP = 10;

function drawInventory() {
  ctx.fillStyle = 'rgba(6,6,14,0.92)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 25;
  ctx.fillStyle = '#a855f7';
  ctx.font = 'bold 48px system-ui, sans-serif';
  ctx.fillText('INVENTARIO', W / 2, 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText('Selecciona una carta especial y luego un slot. Click derecho en un slot para quitarla.', W / 2, 120);
  ctx.restore();

  const availCards = SPECIAL_CARDS.filter(c => state.specialCards[c.id] && state.specialCards[c.id].totalCards > 0);
  const listX = W / 2 - 380;
  const listY = 200;

  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillText('Cartas especiales', listX, listY - 40);
  ctx.restore();

  state.inventoryCardRects = [];

  if (availCards.length === 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '16px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('(No tienes cartas especiales todavía)', listX, listY);
    ctx.restore();
  }

  for (let i = 0; i < availCards.length; i++) {
    const card = availCards[i];
    const info = state.specialCards[card.id];
    const cy = listY + i * (INV_CARD_H + INV_CARD_GAP);
    const selected = state.inventorySelection === card.id;
    state.inventoryCardRects.push({ x: listX, y: cy, w: INV_CARD_W, h: INV_CARD_H, id: card.id });

    const hover = mouse.x >= listX && mouse.x <= listX + INV_CARD_W && mouse.y >= cy && mouse.y <= cy + INV_CARD_H;
    ctx.save();
    if (selected || hover) { ctx.shadowColor = card.color; ctx.shadowBlur = 20; }
    ctx.fillStyle = selected ? 'rgba(168, 85, 247, 0.3)' : 'rgba(20, 25, 45, 0.9)';
    roundRect(listX, cy, INV_CARD_W, INV_CARD_H, 12); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = selected ? card.color : (hover ? 'rgba(168,85,247,0.6)' : 'rgba(255,255,255,0.15)');
    ctx.lineWidth = selected ? 3 : 2;
    roundRect(listX, cy, INV_CARD_W, INV_CARD_H, 12); ctx.stroke();

    // Icono (usando drawCardIcon)
    const iconX = listX + 45;
    const iconY = cy + INV_CARD_H / 2;
    ctx.fillStyle = 'rgba(168, 85, 247, 0.2)';
    ctx.beginPath(); ctx.arc(iconX, iconY, 25, 0, TAU); ctx.fill();
    drawCardIcon(iconX, iconY, 40, card, card.color);

    // Texto
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(card.name, listX + 90, cy + 12);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '12px system-ui, sans-serif';
    wrapText(card.desc, listX + 90, cy + 36, INV_CARD_W - 110, 15);

    // Contador de cartas
    ctx.fillStyle = card.color;
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('×' + info.totalCards, listX + INV_CARD_W - 15, cy + 12);

    // Estado de cargas y cooldown
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    let status = 'Cargas: ' + info.charges + '/' + info.maxCharges;
    if (info.charges < info.maxCharges) {
      status += '  ·  ' + Math.ceil(info.cooldown) + 's';
    }
    ctx.fillText(status, listX + INV_CARD_W - 15, cy + INV_CARD_H - 8);
    ctx.restore();
  }

  // Slots
  const slotsTotalW = 5 * SLOT_W + 4 * SLOT_GAP;
  const slotsX = W / 2 - slotsTotalW / 2;
  const slotsY = H / 2 + 80;

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillText('Slots (presiona 1-5 para usar)', W / 2, slotsY - 40);
  ctx.restore();

  state.inventorySlotRects = [];

  for (let i = 0; i < 5; i++) {
    const sx = slotsX + i * (SLOT_W + SLOT_GAP);
    state.inventorySlotRects.push({ x: sx, y: slotsY, w: SLOT_W, h: SLOT_H });
    const cardId = state.slots[i];
    const card = cardId ? SPECIAL_CARDS.find(c => c.id === cardId) : null;
    const hover = mouse.x >= sx && mouse.x <= sx + SLOT_W && mouse.y >= slotsY && mouse.y <= slotsY + SLOT_H;

    ctx.save();
    if (hover) { ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 20; }
    ctx.fillStyle = card ? 'rgba(168, 85, 247, 0.25)' : 'rgba(255,255,255,0.04)';
    roundRect(sx, slotsY, SLOT_W, SLOT_H, 12); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = card ? '#a855f7' : (hover ? 'rgba(168,85,247,0.5)' : 'rgba(255,255,255,0.15)');
    ctx.lineWidth = card ? 2.5 : 2;
    roundRect(sx, slotsY, SLOT_W, SLOT_H, 12); ctx.stroke();

    ctx.fillStyle = card ? '#fff' : 'rgba(255,255,255,0.35)';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText((i + 1), sx + SLOT_W / 2, slotsY + 10);

    if (card) {
      const ix = sx + SLOT_W / 2;
      const iy = slotsY + SLOT_H / 2 + 5;
      ctx.fillStyle = 'rgba(168, 85, 247, 0.3)';
      ctx.beginPath(); ctx.arc(ix, iy, 22, 0, TAU); ctx.fill();
      drawCardIcon(ix, iy, 34, card, card.color);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(card.name, sx + SLOT_W / 2, slotsY + SLOT_H - 8);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('vacío', sx + SLOT_W / 2, slotsY + SLOT_H / 2 + 10);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText('E o ESC para cerrar', W / 2, H - 40);
  ctx.restore();
}

/* =============== CARTAS UI =============== */
const CARD_W = 230, CARD_H = 320, CARD_GAP = 40;
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', yy = y;
  for (const word of words) {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line.trim(), x, yy);
      line = word + ' ';
      yy += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line.trim(), x, yy);
}

function drawCardIcon(cx, cy, size, card, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = Math.max(3, size * 0.12);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const s = size * 0.5;
  switch (card.id) {
    case 'fire':
      ctx.beginPath();
      ctx.moveTo(-s*0.3, -s); ctx.lineTo(s*0.1, -s*0.1);
      ctx.lineTo(-s*0.1, -s*0.1); ctx.lineTo(s*0.3, s);
      ctx.lineTo(-s*0.1, s*0.1); ctx.lineTo(s*0.15, s*0.1);
      ctx.closePath(); ctx.fill(); break;
    case 'multi':
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.arc(i*s*0.5, s*0.4, s*0.22, 0, TAU); ctx.fill();
        ctx.fillRect(i*s*0.5 - s*0.09, -s*0.9, s*0.18, s*1.0);
      } break;
    case 'health': {
      const hs = s * 1.6;
      ctx.beginPath();
      ctx.moveTo(0, hs*0.3);
      ctx.bezierCurveTo(0, 0, -hs/2, 0, -hs/2, hs*0.3);
      ctx.bezierCurveTo(-hs/2, hs*0.6, 0, hs*0.8, 0, hs);
      ctx.bezierCurveTo(0, hs*0.8, hs/2, hs*0.6, hs/2, hs*0.3);
      ctx.bezierCurveTo(hs/2, 0, 0, 0, 0, hs*0.3);
      ctx.fill(); break;
    }
    case 'speed':
      for (let i = 0; i < 3; i++) {
        const yy = -s*0.6 + i*s*0.6;
        ctx.beginPath();
        ctx.moveTo(-s*0.7, yy); ctx.lineTo(s*0.3, yy);
        ctx.moveTo(s*0.3, yy); ctx.lineTo(s*0.05, yy - s*0.22);
        ctx.moveTo(s*0.3, yy); ctx.lineTo(s*0.05, yy + s*0.22);
        ctx.stroke();
      } break;
    case 'back':
      ctx.beginPath(); ctx.moveTo(-s*0.6, -s*0.5); ctx.lineTo(s*0.6, -s*0.5); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s*0.6, -s*0.5); ctx.lineTo(-s*0.35, -s*0.7);
      ctx.moveTo(-s*0.6, -s*0.5); ctx.lineTo(-s*0.35, -s*0.3);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s*0.6, s*0.5); ctx.lineTo(-s*0.6, s*0.5); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.6, s*0.5); ctx.lineTo(s*0.35, s*0.7);
      ctx.moveTo(s*0.6, s*0.5); ctx.lineTo(s*0.35, s*0.3);
      ctx.stroke(); break;
    case 'drone1': case 'drone2': case 'drone3': {
      ctx.fillRect(-s*0.5, -s*0.5, s, s);
      ctx.strokeRect(-s*0.5, -s*0.5, s, s);
      ctx.fillStyle = '#08080f'; ctx.fillRect(-s*0.15, -s*0.15, s*0.3, s*0.3);
      ctx.fillStyle = color; ctx.fillRect(s*0.5, -s*0.15, s*0.5, s*0.3);
      const lines = card.id === 'drone1' ? 1 : (card.id === 'drone2' ? 2 : 3);
      for (let k = 0; k < lines; k++) ctx.fillRect(-s*0.4 + k*(s*0.4), -s*0.85, s*0.15, s*0.15);
      break;
    }
    case 'magnet':
      ctx.lineWidth = Math.max(2, size*0.07);
      for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(0, 0, s*i*0.28, 0, TAU); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0, 0, s*0.14, 0, TAU); ctx.fill();
      break;
    case 'shield':
      ctx.lineWidth = Math.max(3, size*0.08);
      ctx.beginPath(); ctx.arc(0, 0, s*0.7, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, s*0.35, 0, TAU); ctx.fill(); break;
    case 'bounce':
      ctx.lineWidth = Math.max(3, size*0.08);
      ctx.beginPath(); ctx.arc(0, s*0.3, s*0.5, Math.PI + 0.4, -0.4); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.45, s*0.15); ctx.lineTo(s*0.55, s*0.35); ctx.lineTo(s*0.30, s*0.35); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -s*0.3, s*0.35, 0, TAU); ctx.fill(); break;
    case 'homing':
      ctx.lineWidth = Math.max(3, size*0.08);
      ctx.beginPath();
      ctx.moveTo(-s*0.8, s*0.6); ctx.quadraticCurveTo(-s*0.2, -s*0.8, s*0.6, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.75, -s*0.05); ctx.lineTo(s*0.45, -s*0.25); ctx.lineTo(s*0.55, s*0.15); ctx.fill();
      break;
    case 'dupli':
      ctx.beginPath(); ctx.arc(-s*0.3, s*0.2, s*0.22, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.3, s*0.2, s*0.22, 0, TAU); ctx.fill();
      ctx.lineWidth = Math.max(2, size*0.07);
      ctx.beginPath(); ctx.arc(0, s*0.2, s*0.55, Math.PI + 0.3, -0.3); ctx.stroke(); break;
    case 'size':
      ctx.beginPath(); ctx.arc(-s*0.5, s*0.3, s*0.18, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(s*0.3, -s*0.05, s*0.5, 0, TAU); ctx.fill(); break;
    case 'dart':
      ctx.beginPath();
      ctx.moveTo(0, -s*0.8); ctx.lineTo(-s*0.5, s*0.7); ctx.lineTo(s*0.5, s*0.7);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#08080f';
      ctx.beginPath(); ctx.arc(0, s*0.3, s*0.15, 0, TAU); ctx.fill(); break;
    case 'explosiveDart':
      ctx.beginPath();
      ctx.moveTo(0, -s*0.8); ctx.lineTo(-s*0.35, s*0.4); ctx.lineTo(s*0.35, s*0.4);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fb7185'; ctx.lineWidth = Math.max(2, size*0.08);
      for (let k = 0; k < 6; k++) {
        const a = (k/6)*TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*s*0.5, Math.sin(a)*s*0.5 + s*0.3);
        ctx.lineTo(Math.cos(a)*s*0.85, Math.sin(a)*s*0.85 + s*0.3);
        ctx.stroke();
      } break;
    case 'rayolaser': {
      ctx.lineWidth = Math.max(4, size*0.12);
      ctx.beginPath();
      ctx.moveTo(0, s*0.9); ctx.lineTo(0, -s*0.9);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(0, s*0.9, s*0.2, 0, TAU); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-s*0.3, -s*0.6); ctx.lineTo(0, -s*0.95); ctx.lineTo(s*0.3, -s*0.6);
      ctx.stroke();
      break;
    }
    case 'lightning':
      ctx.beginPath();
      ctx.moveTo(-s*0.2, -s*0.9);
      ctx.lineTo(s*0.3, -s*0.1); ctx.lineTo(-s*0.05, -s*0.1);
      ctx.lineTo(s*0.2, s*0.9); ctx.lineTo(-s*0.3, s*0.1);
      ctx.lineTo(s*0.05, s*0.1); ctx.closePath(); ctx.fill(); break;
    case 'regen': {
      const hs = s * 1.4;
      ctx.beginPath();
      ctx.moveTo(0, hs*0.3);
      ctx.bezierCurveTo(0, 0, -hs/2, 0, -hs/2, hs*0.3);
      ctx.bezierCurveTo(-hs/2, hs*0.6, 0, hs*0.8, 0, hs);
      ctx.bezierCurveTo(0, hs*0.8, hs/2, hs*0.6, hs/2, hs*0.3);
      ctx.bezierCurveTo(hs/2, 0, 0, 0, 0, hs*0.3);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, size*0.06);
      ctx.beginPath();
      ctx.arc(0, s*0.2, s*0.7, Math.PI*0.3, Math.PI*1.7);
      ctx.stroke();
      break;
    }
    case 'greed': {
      ctx.beginPath(); ctx.arc(0, 0, s*0.8, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#08080f'; ctx.lineWidth = Math.max(3, size*0.09);
      ctx.beginPath();
      ctx.moveTo(-s*0.4, 0); ctx.lineTo(s*0.4, 0);
      ctx.moveTo(0, -s*0.4); ctx.lineTo(0, s*0.4);
      ctx.stroke();
      break;
    }
    case 'blink': {
      ctx.lineWidth = Math.max(3, size*0.10);
      ctx.beginPath();
      ctx.moveTo(-s*0.7, s*0.7); ctx.lineTo(s*0.6, -s*0.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s*0.6, -s*0.6); ctx.lineTo(s*0.6, -s*0.1);
      ctx.moveTo(s*0.6, -s*0.6); ctx.lineTo(s*0.1, -s*0.6);
      ctx.stroke();
      for (let k = 0; k < 4; k++) {
        const a = (k/4)*TAU + Math.PI/4;
        ctx.beginPath();
        ctx.moveTo(-s*0.7 + Math.cos(a)*s*0.2, s*0.7 + Math.sin(a)*s*0.2);
        ctx.lineTo(-s*0.7 + Math.cos(a)*s*0.45, s*0.7 + Math.sin(a)*s*0.45);
        ctx.stroke();
      }
      break;
    }
    case 'dash': {
      ctx.lineWidth = Math.max(3, size*0.10);
      for (let i = 0; i < 3; i++) {
        const offset = i * s * 0.3 - s * 0.4;
        ctx.beginPath();
        ctx.moveTo(offset - s*0.3, -s*0.6);
        ctx.lineTo(offset + s*0.25, 0);
        ctx.lineTo(offset - s*0.3, s*0.6);
        ctx.stroke();
      }
      break;
    }
    case 'thunderRain': {
      for (let i = 0; i < 3; i++) {
        const ox = (i - 1) * s * 0.55;
        ctx.beginPath();
        ctx.moveTo(ox - s*0.1, -s*0.8);
        ctx.lineTo(ox + s*0.15, -s*0.2);
        ctx.lineTo(ox - s*0.02, -s*0.2);
        ctx.lineTo(ox + s*0.1, s*0.8);
        ctx.lineTo(ox - s*0.15, s*0.1);
        ctx.lineTo(ox + s*0.02, s*0.1);
        ctx.closePath();
        ctx.fill();
      }
      break;
    }
  }
  ctx.restore();
}

function drawCards() {
  ctx.fillStyle = 'rgba(6,6,14,0.82)';
  ctx.fillRect(0, 0, W, H);
  const cards = state.cardChoices;
  const totalW = cards.length * CARD_W + (cards.length - 1) * CARD_GAP;
  const startX = W / 2 - totalW / 2;
  const y = H / 2 - CARD_H / 2;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffd54a'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#ffd54a';
  ctx.font = 'bold 42px system-ui, sans-serif';
  ctx.fillText('¡NIVEL ' + state.level + '!', W / 2, y - 100);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText('Elige una mejora', W / 2, y - 55);
  if (state.pendingLevelUps > 1) {
    ctx.fillStyle = 'rgba(255,213,74,0.75)';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText('+' + (state.pendingLevelUps - 1) + ' subida(s) pendiente(s)', W / 2, y - 30);
  }
  ctx.restore();
  state.cardRects = [];
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    const cx = startX + i * (CARD_W + CARD_GAP);
    state.cardRects.push({ x: cx, y, w: CARD_W, h: CARD_H });
    const hover = mouse.x >= cx && mouse.x <= cx + CARD_W && mouse.y >= y && mouse.y <= y + CARD_H;
    const lift = hover ? -10 : 0;
    ctx.save();
    ctx.translate(0, lift);
    if (hover) { ctx.shadowColor = card.color; ctx.shadowBlur = 40; }
    else { ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 20; }
    const grad = ctx.createLinearGradient(cx, y, cx, y + CARD_H);
    grad.addColorStop(0, '#1a2340'); grad.addColorStop(1, '#0f1428');
    ctx.fillStyle = grad;
    roundRect(cx, y, CARD_W, CARD_H, 18); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = card.color; ctx.lineWidth = hover ? 3 : 2;
    roundRect(cx, y, CARD_W, CARD_H, 18); ctx.stroke();
    if (SPECIAL_CARDS.find(c => c.id === card.id)) {
      ctx.fillStyle = 'rgba(168, 85, 247, 0.9)';
      roundRect(cx + CARD_W - 80, y + 8, 72, 18, 9); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('ESPECIAL', cx + CARD_W - 44, y + 17);
    }
    const iconY = y + 95;
    ctx.globalAlpha = 0.16; ctx.fillStyle = card.color;
    ctx.beginPath(); ctx.arc(cx + CARD_W/2, iconY, 55, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    drawCardIcon(cx + CARD_W/2, iconY, 60, card, card.color);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText(card.name, cx + CARD_W/2, y + 185);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + 30, y + 210); ctx.lineTo(cx + CARD_W - 30, y + 210);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '15px system-ui, sans-serif';
    wrapText(card.desc, cx + CARD_W/2, y + 230, CARD_W - 40, 20);
    ctx.fillStyle = hover ? card.color : 'rgba(255,255,255,0.35)';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText('[' + (i + 1) + ']', cx + CARD_W/2, y + CARD_H - 22);
    ctx.restore();
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(6,6,14,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.shadowColor = '#ff3b6b'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#ff3b6b';
  ctx.font = 'bold 64px system-ui, sans-serif';
  ctx.fillText('HAS CAÍDO', W / 2, H / 2 - 80);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText('Puntos: ' + state.score, W / 2, H / 2 - 5);
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = '20px system-ui, sans-serif';
  ctx.fillText('Bajas: ' + state.kills + '   ·   Nivel: ' + state.level, W / 2, H / 2 + 35);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('Supervivencia: ' + state.time.toFixed(1) + 's', W / 2, H / 2 + 65);
  if (state.overTimer > 0.5) {
    const a = 0.5 + 0.5 * Math.sin(state.overTimer * 5);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#4df3ff';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillText('Pulsa R o haz CLIC para volver a jugar', W / 2, H / 2 + 125);
    ctx.globalAlpha = 1;
  }
}

/* =============== BUCLE =============== */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
