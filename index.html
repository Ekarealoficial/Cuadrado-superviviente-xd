<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuadrado Superviviente - Rogue</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#08080f; }
  canvas { display:block; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

/* =============== AUDIO =============== */
const Sfx = {
  ctx: null, master: null, last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.4;
    this.master.connect(this.ctx.destination);
  },
  tone(freq, dur, type, vol, slideTo) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, cutoff) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const size = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cutoff || 1000;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  play(name, throttle) {
    if (!this.ctx) return;
    const now = performance.now();
    if (throttle && this.last[name] && now - this.last[name] < throttle) return;
    this.last[name] = now;
    switch (name) {
      case 'shoot':   this.tone(900, 0.06, 'square', 0.10, 260); break;
      case 'hit':     this.tone(320, 0.05, 'square', 0.12, 140); break;
      case 'kill':    this.tone(460, 0.18, 'sawtooth', 0.2, 90); this.noise(0.14, 0.15, 900); break;
      case 'damage':  this.tone(150, 0.35, 'sawtooth', 0.3, 55); this.noise(0.25, 0.22, 350); break;
      case 'pickup':  this.tone(720, 0.06, 'triangle', 0.13); setTimeout(() => this.tone(1080, 0.08, 'triangle', 0.13), 45); break;
      case 'potion':  this.tone(523, 0.09, 'triangle', 0.22); setTimeout(() => this.tone(659, 0.09, 'triangle', 0.22), 70); setTimeout(() => this.tone(784, 0.15, 'triangle', 0.22), 140); break;
      case 'levelup': this.tone(523, 0.1, 'sine', 0.22); setTimeout(() => this.tone(784, 0.12, 'sine', 0.22), 90); break;
      case 'pick':    this.tone(880, 0.08, 'triangle', 0.25); setTimeout(() => this.tone(1320, 0.15, 'triangle', 0.25), 80); break;
      case 'cardpop': this.tone(660, 0.05, 'sine', 0.15); setTimeout(() => this.tone(990, 0.1, 'sine', 0.15), 60); break;
      case 'enemyshoot': this.tone(400, 0.08, 'sawtooth', 0.15, 200); break;
      case 'shieldblock': this.tone(700, 0.06, 'sine', 0.18, 500); break;
      case 'shieldbreak': this.tone(300, 0.25, 'sawtooth', 0.25, 100); this.noise(0.15, 0.15, 800); break;
      case 'explode': this.tone(120, 0.4, 'sawtooth', 0.35, 40); this.noise(0.3, 0.3, 400); break;
      case 'teleport': this.tone(600, 0.15, 'sine', 0.18, 1200); break;
      case 'dash':    this.tone(200, 0.3, 'sawtooth', 0.25, 80); break;
      case 'laser':   this.tone(1400, 0.6, 'sawtooth', 0.20, 200); this.noise(0.4, 0.2, 2000); break;
      case 'lasercharge': this.tone(600, 0.3, 'sine', 0.10, 1800); break;
      case 'lightning': this.tone(80, 0.3, 'sawtooth', 0.35, 30); this.noise(0.2, 0.3, 600); break;
      case 'bossroar': this.tone(90, 0.8, 'sawtooth', 0.4, 30); this.noise(0.6, 0.35, 300); break;
      case 'bossdie': this.tone(120, 1.2, 'sawtooth', 0.4, 20); this.noise(0.8, 0.4, 250); break;
      case 'regen':   this.tone(660, 0.15, 'sine', 0.2); setTimeout(() => this.tone(880, 0.2, 'sine', 0.2), 100); break;
      case 'blink':   this.tone(1200, 0.15, 'sine', 0.25, 2400); setTimeout(() => this.tone(1800, 0.2, 'sine', 0.2, 800), 100); break;
      case 'inventory': this.tone(500, 0.08, 'triangle', 0.15); setTimeout(() => this.tone(700, 0.08, 'triangle', 0.15), 60); break;
      case 'dashplayer': this.tone(300, 0.2, 'sawtooth', 0.3, 600); this.noise(0.15, 0.2, 1200); break;
      case 'thunderrain': this.tone(60, 0.5, 'sawtooth', 0.4, 30); this.noise(0.4, 0.35, 500); break;
    }
  }
};

const CHUNK_SIZE = 800;
const START_HALF_HEARTS = 8;
const START_MAGNET = 200;
const MAX_BULLETS = 200;
const BOSS_FIRST_TIME = 150;

/* =============== CARTAS =============== */
const CARD_TYPES = [
  { id: 'fire',          name: 'Cadencia',       desc: 'Reduce el tiempo entre disparos un 15%.',                    color: '#4df3ff' },
  { id: 'multi',         name: 'Multidisparo',   desc: 'Añade una línea de disparo adicional.',                       color: '#ffc857' },
  { id: 'health',        name: 'Vitalidad',      desc: 'Aumenta vida máxima en medio corazón y te cura medio.',       color: '#ff3b6b' },
  { id: 'speed',         name: 'Agilidad',       desc: 'Aumenta tu velocidad un 10%.',                                color: '#8fff9e' },
  { id: 'back',          name: 'Retroceso',      desc: 'Dispara también hacia atrás. Acumulable.',                    color: '#c77dff' },
  { id: 'drone1',        name: 'Dron Básico',    desc: 'Añade un dron con 1 línea de disparo.',                       color: '#4dff88' },
  { id: 'drone2',        name: 'Dron Doble',     desc: 'Añade un dron con 2 líneas de disparo.',                      color: '#7dffb0' },
  { id: 'drone3',        name: 'Dron Triple',    desc: 'Añade un dron con 3 líneas de disparo.',                      color: '#a8ffcf' },
  { id: 'magnet',        name: 'Imán de XP',     desc: 'Aumenta el radio de atracción de orbes.',                     color: '#b0d4ff' },
  { id: 'shield',        name: 'Escudo',         desc: 'Añade un escudo orbital que bloquea balas.',                  color: '#4df3ff' },
  { id: 'bounce',        name: 'Rebote',         desc: 'Tus balas rebotan una vez más.',                              color: '#fbbf24' },
  { id: 'homing',        name: 'Teledirigido',   desc: '+30% de probabilidad de balas teledirigidas.',                color: '#a855f7' },
  { id: 'dupli',         name: 'Duplibala',      desc: '10% de balas que rebotan y se duplican. Acumulable.',         color: '#ff4dd2' },
  { id: 'size',          name: 'Tamaño',         desc: 'Aumenta el tamaño y daño de tus balas.',                     color: '#f59e0b' },
  { id: 'dart',          name: 'Dardos',         desc: 'Añade un dardo aliado que persigue enemigos.',                color: '#fcd34d' },
  { id: 'explosiveDart', name: 'Dardo Explosivo',desc: 'Añade un dardo que explota al impactar.',                     color: '#fb7185' },
  { id: 'rayolaser',     name: 'Rayo Láser',     desc: 'Mantén clic para cargar y suelta para disparar un rayo giratorio.', color: '#ff3366' },
  { id: 'lightning',     name: 'Rayo',           desc: 'Rayos caen periódicamente sobre enemigos.',                   color: '#fde047' },
  { id: 'regen',         name: 'Regeneración',   desc: 'Recupera medio corazón cada 50s. Acumulable: -1s al intervalo.', color: '#4ade80' },
  { id: 'greed',         name: 'Codicia',        desc: '15% de probabilidad de soltar XP extra al matar. Acumulable.', color: '#fbbf24' }
];
const SPECIAL_CARDS = [
  { id: 'blink',       name: 'Distorsión',   desc: 'Cada 35s teletranspórtate al puntero. Asigna a un slot.',   color: '#a855f7' },
  { id: 'dash',        name: 'Dash',         desc: 'Dash rápido hacia el puntero. Cargas = número de cartas.',  color: '#22d3ee' },
  { id: 'thunderRain', name: 'Lluvia Truenos',desc: 'Rayos caen sobre todos los enemigos en pantalla. 3s base.', color: '#fbbf24' }
];

/* =============== ESTADO =============== */
function newState() {
  return {
    player: {
      x: 0, y: 0, vx: 0, vy: 0,
      size: 30, speed: 320,
      angle: 0, invuln: 0,
      fireCd: 0, fireCdBase: 0.28, shots: 1, backShots: 0,
      bounces: 0, homingChance: 0,
      dupliCount: 0, dupliChance: 0,
      sizeLevel: 0,
      laserCount: 0,
      lightningCount: 0,
      lightningCd: 5,
      regenLevel: 0,
      regenTimer: 0,
      regenInterval: 50,
      regenAmount: 1,
      greedLevel: 0,
      dashTimer: 0,
      dashAngle: 0,
      pendingDashes: 0
    },
    laserCharging: false,
    laserChargeTime: 0,
    lasersFiring: [],
    drones: [],
    darts: [],
    enemyDarts: [],
    lightningStrikes: [],
    shields: [],
    magnetRange: START_MAGNET,
    cam: { x: 0, y: 0, zoom: 1 },
    bullets: [], enemyBullets: [], enemies: [],
    particles: [], orbs: [], potions: [], floats: [],
    halfHearts: START_HALF_HEARTS,
    maxHalfHearts: START_HALF_HEARTS,
    xp: 0, xpNeeded: 8, level: 1,
    score: 0, kills: 0, time: 0,
    spawnTimer: 1.8, potionTimer: 9,
    shake: 0, flash: 0, flashRGB: '255,60,100',
    over: false, overTimer: 0,
    cardChoices: null, cardRects: null,
    pendingLevelUps: 0,
    boss: null, bossActive: false, arena: null,
    bossBombs: [], bossLasers: [], bossLaserActive: false, bossLaserTimer: 0,
    bossSpawnTimer: BOSS_FIRST_TIME, bossWarningShown: false,
    playerDamageMult: 1.0, enemyHpMult: 1.0, spawnRateMult: 1.0,
    levelTimer: 0, damageTimer: 0, adaptiveCheckTimer: 0,
    inventoryOpen: false,
    inventorySelection: null,
    inventoryCardRects: [],
    inventorySlotRects: [],
    slots: [null, null, null, null, null],
    specialCards: {
      blink:       { totalCards: 0, charges: 0, maxCharges: 0, cooldown: 0, cooldownMax: 35 },
      dash:        { totalCards: 0, charges: 0, maxCharges: 0, cooldown: 0, cooldownMax: 18 },
      thunderRain: { totalCards: 0, charges: 0, maxCharges: 0, cooldown: 0, cooldownMax: 45 }
    },
    thunderRain: { active: false, timer: 0, strikeTimer: 0 }
  };
}
let state = newState();
const chunkCache = new Map();
let currentWalls = [];

/* =============== INPUT =============== */
const keys = Object.create(null);
const mouse = { x: W / 2, y: H / 2, down: false };
function ensureAudio() {
  Sfx.init();
  if (Sfx.ctx && Sfx.ctx.state === 'suspended') Sfx.ctx.resume();
}
function getWorldMouse() {
  return {
    x: (mouse.x - W/2) / state.cam.zoom + state.cam.x,
    y: (mouse.y - H/2) / state.cam.zoom + state.cam.y
  };
}

window.addEventListener('keydown', e => {
  ensureAudio();
  const k = e.key.toLowerCase();

  if (state.cardChoices) {
    if (k === '1' || k === '2' || k === '3') {
      const idx = parseInt(k) - 1;
      if (idx < state.cardChoices.length) pickCard(state.cardChoices[idx]);
      e.preventDefault();
    }
    return;
  }

  if (k === 'e') {
    state.inventoryOpen = !state.inventoryOpen;
    state.inventorySelection = null;
    state.laserCharging = false;
    state.laserChargeTime = 0;
    Sfx.play('inventory');
    e.preventDefault();
    return;
  }
  if (state.inventoryOpen) {
    if (k === 'escape') {
      state.inventoryOpen = false;
      state.inventorySelection = null;
      e.preventDefault();
    }
    return;
  }

  if (k >= '1' && k <= '5') {
    const slotIdx = parseInt(k) - 1;
    useSlot(slotIdx);
    e.preventDefault();
    return;
  }

  keys[k] = true;
  if (k === 'r' && state.over && state.overTimer > 0.3) restart();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => {
  ensureAudio();
  if (e.button === 0) {
    if (state.over) { if (state.overTimer > 0.4) restart(); return; }
    if (state.cardChoices) {
      if (state.cardRects) {
        for (let i = 0; i < state.cardRects.length; i++) {
          const r = state.cardRects[i];
          if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
            pickCard(state.cardChoices[i]);
            return;
          }
        }
      }
      return;
    }
    if (state.inventoryOpen) {
      for (const cr of state.inventoryCardRects) {
        if (mouse.x >= cr.x && mouse.x <= cr.x + cr.w && mouse.y >= cr.y && mouse.y <= cr.y + cr.h) {
          state.inventorySelection = cr.id;
          Sfx.play('inventory', 80);
          return;
        }
      }
      for (let i = 0; i < state.inventorySlotRects.length; i++) {
        const sr = state.inventorySlotRects[i];
        if (mouse.x >= sr.x && mouse.x <= sr.x + sr.w && mouse.y >= sr.y && mouse.y <= sr.y + sr.h) {
          if (state.inventorySelection) {
            state.slots[i] = state.inventorySelection;
            Sfx.play('pick', 60);
          }
          return;
        }
      }
      return;
    }
    mouse.down = true;
  } else if (e.button === 2) {
    if (state.inventoryOpen) {
      for (let i = 0; i < state.inventorySlotRects.length; i++) {
        const sr = state.inventorySlotRects[i];
        if (mouse.x >= sr.x && mouse.x <= sr.x + sr.w && mouse.y >= sr.y && mouse.y <= sr.y + sr.h) {
          state.slots[i] = null;
          Sfx.play('inventory', 60);
          return;
        }
      }
    }
  }
});
window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
window.addEventListener('blur', () => { mouse.down = false; for (const k in keys) keys[k] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function restart() { state = newState(); mouse.down = false; chunkCache.clear(); }

/* =============== SLOTS =============== */
function useSlot(idx) {
  const cardId = state.slots[idx];
  if (!cardId) return;
  if (cardId === 'blink') {
    if (tryBlink()) Sfx.play('blink');
  } else if (cardId === 'dash') {
    if (tryDash()) Sfx.play('dashplayer');
  } else if (cardId === 'thunderRain') {
    if (tryThunderRain()) Sfx.play('thunderrain');
  }
}

function tryBlink() {
  const sc = state.specialCards.blink;
  if (sc.charges <= 0) return false;
  const target = getWorldMouse();
  let tx = target.x, ty = target.y;
  if (pointInWall(tx, ty, currentWalls)) {
    let found = false;
    for (let r = 20; r <= 300 && !found; r += 20) {
      for (let a = 0; a < 8; a++) {
        const ang = (a / 8) * TAU;
        const nx = target.x + Math.cos(ang) * r;
        const ny = target.y + Math.sin(ang) * r;
        if (!pointInWall(nx, ny, currentWalls)) {
          tx = nx; ty = ny; found = true; break;
        }
      }
    }
    if (!found) return false;
  }
  if (state.arena) {
    tx = clamp(tx, state.arena.x + state.player.size/2, state.arena.x + state.arena.w - state.player.size/2);
    ty = clamp(ty, state.arena.y + state.player.size/2, state.arena.y + state.arena.h - state.player.size/2);
  }

  const oldX = state.player.x, oldY = state.player.y;

  // Afterimage trail (línea de partículas)
  const steps = 8;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const ix = oldX + (tx - oldX) * t;
    const iy = oldY + (ty - oldY) * t;
    spawnParticles(ix, iy, 1, '#a855f7', 0.8);
    state.particles.push({
      x: ix, y: iy,
      vx: 0, vy: 0,
      life: 0.5, maxLife: 0.5,
      size: 6, color: '#c4b5fd'
    });
  }

  // Shockwave en origen
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU;
    state.particles.push({
      x: oldX, y: oldY,
      vx: Math.cos(a) * 350,
      vy: Math.sin(a) * 350,
      life: 0.6, maxLife: 0.6,
      size: 5, color: '#a855f7'
    });
  }
  // Shockwave en destino
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU + 0.2;
    state.particles.push({
      x: tx, y: ty,
      vx: Math.cos(a) * 350,
      vy: Math.sin(a) * 350,
      life: 0.6, maxLife: 0.6,
      size: 5, color: '#e9d5ff'
    });
  }
  // Anillos de distorsión (partículas grandes que se expanden)
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU;
    state.particles.push({
      x: oldX, y: oldY,
      vx: Math.cos(a) * 200,
      vy: Math.sin(a) * 200,
      life: 0.7, maxLife: 0.7,
      size: 10, color: '#a855f7'
    });
    state.particles.push({
      x: tx, y: ty,
      vx: Math.cos(a) * 200,
      vy: Math.sin(a) * 200,
      life: 0.7, maxLife: 0.7,
      size: 10, color: '#e9d5ff'
    });
  }

  // Mover
  state.player.x = tx;
  state.player.y = ty;
  state.cam.x = tx;
  state.cam.y = ty;
  state.cam.zoom = Math.min(state.cam.zoom, 0.85);
  state.flash = 0.45;
  state.flashRGB = '168,85,247';
  state.shake = Math.max(state.shake, 12);

  sc.charges--;
  if (sc.cooldown <= 0) sc.cooldown = sc.cooldownMax;
  return true;
}

function tryDash() {
  const sc = state.specialCards.dash;
  const p = state.player;

  if (p.dashTimer > 0) {
    // Encadenar
    if (p.pendingDashes < sc.charges && sc.charges > 0) {
      p.pendingDashes++;
      return true;
    }
    return false;
  }

  if (sc.charges <= 0) return false;
  const target = getWorldMouse();
  p.dashAngle = Math.atan2(target.y - p.y, target.x - p.x);
  p.dashTimer = 0.25;
  p.invuln = Math.max(p.invuln, 0.3);
  sc.charges--;
  if (sc.cooldown <= 0) sc.cooldown = sc.cooldownMax;
  // Efecto de inicio
  spawnParticles(p.x, p.y, 12, '#22d3ee', 1);
  return true;
}

function tryThunderRain() {
  const sc = state.specialCards.thunderRain;
  if (sc.charges <= 0) return false;
  sc.charges--;
  if (sc.cooldown <= 0) sc.cooldown = sc.cooldownMax;
  const level = sc.totalCards;
  state.thunderRain.active = true;
  state.thunderRain.timer = 3 + (level - 1) * 2;
  state.thunderRain.strikeTimer = 0;
  state.flash = 0.3;
  state.flashRGB = '253,224,71';
  return true;
}

function isOnScreen(x, y) {
  const halfW = W / state.cam.zoom / 2;
  const halfH = H / state.cam.zoom / 2;
  return Math.abs(x - state.cam.x) < halfW + 120 && Math.abs(y - state.cam.y) < halfH + 120;
}

/* =============== MUNDO PROCEDURAL =============== */
function hash2D(x, y) {
  let h = ((x | 0) * 374761393 + (y | 0) * 668265263) | 0;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177) >>> 0;
  h = (h ^ (h >>> 16)) >>> 0;
  return h;
}
function makeRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}
function getChunk(cx, cy) {
  const key = cx + ',' + cy;
  let c = chunkCache.get(key);
  if (c) return c;
  const rng = makeRng(hash2D(cx, cy));
  const isSpawn = (cx === 0 && cy === 0);
  const walls = [];
  if (!isSpawn) {
    const roll = rng();
    const n = roll < 0.4 ? 0 : (roll < 0.75 ? 1 : (roll < 0.92 ? 2 : 3));
    const margin = 90;
    for (let i = 0, tries = 0; i < n && tries < n * 6; tries++) {
      const w = 70 + rng() * 180;
      const h = 70 + rng() * 180;
      const x = cx * CHUNK_SIZE + rng() * (CHUNK_SIZE - w);
      const y = cy * CHUNK_SIZE + rng() * (CHUNK_SIZE - h);
      if (x < cx * CHUNK_SIZE + margin || x + w > (cx + 1) * CHUNK_SIZE - margin) continue;
      if (y < cy * CHUNK_SIZE + margin || y + h > (cy + 1) * CHUNK_SIZE - margin) continue;
      let overlaps = false;
      for (const ow of walls) {
        if (x < ow.x + ow.w + 40 && x + w > ow.x - 40 && y < ow.y + ow.h + 40 && y + h > ow.y - 40) { overlaps = true; break; }
      }
      if (overlaps) continue;
      walls.push({ x, y, w, h });
      i++;
    }
  }
  c = { walls };
  chunkCache.set(key, c);
  return c;
}
function getVisibleChunks(cam) {
  const visW = W / cam.zoom, visH = H / cam.zoom;
  const margin = 150;
  const l = cam.x - visW/2 - margin, r = cam.x + visW/2 + margin;
  const t = cam.y - visH/2 - margin, b = cam.y + visH/2 + margin;
  const cxMin = Math.floor(l / CHUNK_SIZE), cxMax = Math.floor(r / CHUNK_SIZE);
  const cyMin = Math.floor(t / CHUNK_SIZE), cyMax = Math.floor(b / CHUNK_SIZE);
  const walls = [];
  for (let cy = cyMin; cy <= cyMax; cy++)
    for (let cx = cxMin; cx <= cxMax; cx++) {
      const c = getChunk(cx, cy);
      for (const w of c.walls) walls.push(w);
    }
  return walls;
}

/* =============== COLISIONES =============== */
function aabbOverlapCircle(x, y, r, w) {
  const nx = clamp(x, w.x, w.x + w.w), ny = clamp(y, w.y, w.y + w.h);
  const dx = x - nx, dy = y - ny;
  return dx*dx + dy*dy < r*r;
}
function aabbOverlapBox(x, y, size, w) {
  return x - size/2 < w.x + w.w && x + size/2 > w.x && y - size/2 < w.y + w.h && y + size/2 > w.y;
}
function pointInWall(x, y, walls) {
  for (const w of walls) if (x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h) return true;
  return false;
}
function moveWithWalls(entity, dx, dy, walls) {
  let blockedX = false, blockedY = false;
  entity.x += dx;
  for (const w of walls) {
    if (aabbOverlapBox(entity.x, entity.y, entity.size, w)) {
      if (dx > 0) entity.x = w.x - entity.size/2;
      else if (dx < 0) entity.x = w.x + w.w + entity.size/2;
      blockedX = true;
    }
  }
  entity.y += dy;
  for (const w of walls) {
    if (aabbOverlapBox(entity.x, entity.y, entity.size, w)) {
      if (dy > 0) entity.y = w.y - entity.size/2;
      else if (dy < 0) entity.y = w.y + w.h + entity.size/2;
      blockedY = true;
    }
  }
  return { blockedX, blockedY };
}
function laserHits(x, y, radius, lx, ly, angle, width, range) {
  const dx = x - lx, dy = y - ly;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const proj = dx * cos + dy * sin;
  if (proj < 0 || proj > range) return false;
  const perp = -dx * sin + dy * cos;
  return Math.abs(perp) < width / 2 + radius;
}
function getNearestTarget(x, y) {
  let nearest = null, nearestD2 = Infinity;
  for (const e of state.enemies) {
    const dd = (e.x - x)**2 + (e.y - y)**2;
    if (dd < nearestD2) { nearestD2 = dd; nearest = e; }
  }
  if (state.boss) {
    const b = state.boss;
    const dd = (b.x - x)**2 + (b.y - y)**2;
    if (dd < nearestD2) { nearestD2 = dd; nearest = b; }
    for (const ball of b.balls) {
      if (ball.state === 'attached') continue;
      const dd2 = (ball.x - x)**2 + (ball.y - y)**2;
      if (dd2 < nearestD2) { nearestD2 = dd2; nearest = ball; }
    }
  }
  return nearest;
}
function isBossOrBall(obj) {
  if (!state.boss) return false;
  if (obj === state.boss) return true;
  return state.boss.balls.indexOf(obj) !== -1;
}

/* =============== ENEMIGOS =============== */
const ENEMY_TYPES = {
  normal:     { size: 28, hp: 2, speed: 95,  color: '#ff5a6e', xp: 3 },
  fast:       { size: 18, hp: 1, speed: 195, color: '#ffc857', xp: 2 },
  tank:       { size: 52, hp: 7, speed: 62,  color: '#b06bff', xp: 8 },
  shooter:    { size: 26, hp: 3, speed: 145, color: '#ff8c42', xp: 6 },
  invoker:    { size: 34, hp: 5, speed: 70,  color: '#8b5cf6', xp: 12 },
  teleporter: { size: 24, hp: 2, speed: 110, color: '#06b6d4', xp: 7 },
  kamikaze:   { size: 22, hp: 2, speed: 250, color: '#ef4444', xp: 4 },
  dardante:   { size: 32, hp: 4, speed: 110, color: '#fbbf24', xp: 8 },
  juggernaut: { size: 90, hp: 80, speed: 0,  color: '#9f1239', xp: 50 }
};

function chooseEnemyType(t) {
  const r = Math.random();
  if (t < 20) return r < 0.85 ? 'normal' : 'fast';
  if (t < 40) return r < 0.50 ? 'normal' : (r < 0.85 ? 'fast' : 'tank');
  if (t < 55) {
    if (r < 0.40) return 'normal';
    if (r < 0.64) return 'fast';
    if (r < 0.80) return 'tank';
    if (r < 0.92) return 'shooter';
    return 'kamikaze';
  }
  if (t < 75) {
    if (r < 0.30) return 'normal';
    if (r < 0.50) return 'fast';
    if (r < 0.66) return 'tank';
    if (r < 0.80) return 'shooter';
    if (r < 0.90) return 'kamikaze';
    return 'invoker';
  }
  if (t < 100) {
    if (r < 0.24) return 'normal';
    if (r < 0.42) return 'fast';
    if (r < 0.54) return 'tank';
    if (r < 0.66) return 'shooter';
    if (r < 0.78) return 'kamikaze';
    if (r < 0.88) return 'invoker';
    if (r < 0.96) return 'teleporter';
    return 'dardante';
  }
  if (r < 0.14) return 'normal';
  if (r < 0.26) return 'fast';
  if (r < 0.38) return 'tank';
  if (r < 0.50) return 'shooter';
  if (r < 0.62) return 'kamikaze';
  if (r < 0.74) return 'invoker';
  if (r < 0.84) return 'teleporter';
  if (r < 0.92) return 'dardante';
  return 'juggernaut';
}

function createEnemy(type, x, y, extra) {
  const base = ENEMY_TYPES[type];
  const bonus = Math.min(state.time * 0.35, 40);
  const spd = base.speed + bonus * (type === 'tank' ? 0.35 : (type === 'juggernaut' ? 0 : (type === 'shooter' || type === 'invoker' || type === 'teleporter' || type === 'dardante' ? 0.4 : 1)));
  const hp = Math.round(base.hp * state.enemyHpMult);
  const e = Object.assign({
    type, x, y,
    size: base.size,
    hp, maxHp: hp,
    speed: spd,
    color: base.color,
    hitFlash: 0,
    wob: Math.random() * TAU,
    xp: base.xp,
    shootCd: 1 + Math.random() * 1.2
  }, extra || {});
  if (type === 'juggernaut') {
    e.jState = 'idle'; e.jTimer = 3 + Math.random() * 2;
    e.jAngle = 0; e.jHit = false; e.vx = 0; e.vy = 0;
  }
  return e;
}

function spawnEnemy() {
  if (state.enemies.length > 90) return;
  const type = chooseEnemyType(state.time);
  const p = state.player;
  const minDist = Math.max(W, H) * 0.6 / state.cam.zoom + 100;
  const dist = minDist + Math.random() * 300;
  const angle = Math.random() * TAU;
  state.enemies.push(createEnemy(type, p.x + Math.cos(angle) * dist, p.y + Math.sin(angle) * dist));
}
function spawnOrbs(x, y, totalXp) {
  const n = clamp(Math.round(totalXp / 2), 1, 5);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = 60 + Math.random() * 140;
    state.orbs.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, value: totalXp/n, life: 25, pulse: Math.random()*TAU });
  }
}
function spawnPotion(walls) {
  const p = state.player;
  for (let attempt = 0; attempt < 12; attempt++) {
    const angle = Math.random() * TAU;
    const dist = 280 + Math.random() * 450;
    const x = p.x + Math.cos(angle) * dist, y = p.y + Math.sin(angle) * dist;
    let blocked = false;
    for (const w of walls) {
      if (x > w.x - 20 && x < w.x + w.w + 20 && y > w.y - 20 && y < w.y + w.h + 20) { blocked = true; break; }
    }
    if (blocked) continue;
    const isLarge = Math.random() < 0.35;
    state.potions.push({ x, y, type: isLarge ? 'large' : 'small', value: isLarge ? 2 : 1, life: 45, maxLife: 45, bob: Math.random()*TAU });
    if (state.potions.length > 6) state.potions.shift();
    return;
  }
}
function spawnParticles(x, y, n, color, mul = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = rand(60, 340) * mul;
    const life = rand(0.25, 0.7);
    state.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life, maxLife: life, size: rand(2,5), color });
  }
}
function addFloat(x, y, text, color) {
  state.floats.push({ x, y, text, color, life: 1.1, maxLife: 1.1, vy: -55 });
}

/* =============== BALAS =============== */
function spawnBullet(x, y, angle, speed, opts) {
  opts = opts || {};
  if (state.bullets.length >= MAX_BULLETS) return;
  state.bullets.push({
    x, y,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    r: opts.radius !== undefined ? opts.radius : 4,
    life: 1.6,
    drone: !!opts.drone,
    bounces: opts.bounces || 0,
    homing: !!opts.homing,
    dupli: opts.dupli || 0,
    damage: opts.damage !== undefined ? opts.damage : 1
  });
}

function shoot(n) {
  const p = state.player;
  const speed = 900;
  const off = p.size / 2 + 6;
  const baseRadius = 4 + p.sizeLevel * 1.2;
  const baseDamage = 1 + Math.floor(p.sizeLevel * 0.75);
  const spread = 0.12;
  const fullSpread = (p.shots - 1) * spread;
  const skipOriginal = (n < p.shots);
  const startIdx = skipOriginal ? 1 : 0;
  for (let k = 0; k < n; k++) {
    const i = startIdx + k;
    const offset = -fullSpread / 2 + i * spread;
    const a = p.angle + offset + (Math.random() - 0.5) * 0.03;
    const isHoming = Math.random() < p.homingChance;
    const isDupli = Math.random() < p.dupliChance;
    spawnBullet(p.x + Math.cos(a) * off, p.y + Math.sin(a) * off, a, speed, {
      bounces: p.bounces, homing: isHoming,
      dupli: isDupli ? p.dupliCount : 0,
      damage: baseDamage, radius: baseRadius
    });
    spawnParticles(p.x + Math.cos(a) * off, p.y + Math.sin(a) * off, 2, '#9ef7ff', 0.5);
  }
  const bn = p.backShots;
  if (bn > 0) {
    const bAngle = p.angle + Math.PI, bSpread = 0.12;
    const bTotal = (bn - 1) * bSpread;
    for (let i = 0; i < bn; i++) {
      const offset = -bTotal / 2 + i * bSpread;
      const a = bAngle + offset + (Math.random() - 0.5) * 0.03;
      const isHoming = Math.random() < p.homingChance;
      const isDupli = Math.random() < p.dupliChance;
      spawnBullet(p.x + Math.cos(a) * off, p.y + Math.sin(a) * off, a, speed * 0.9, {
        bounces: p.bounces, homing: isHoming,
        dupli: isDupli ? p.dupliCount : 0,
        damage: baseDamage, radius: baseRadius
      });
      spawnParticles(p.x + Math.cos(a) * off, p.y + Math.sin(a) * off, 2, '#c77dff', 0.5);
    }
  }
  state.shake = Math.min(state.shake + 0.6, 4);
  Sfx.play('shoot', 30);
}

function damagePlayer(amount) {
  amount = amount || 1;
  const p = state.player;
  if (p.invuln > 0) return;
  state.halfHearts -= amount;
  p.invuln = 1.0;
  state.shake = 20 + amount * 5;
  state.flash = 0.4;
  state.flashRGB = '255,60,100';
  state.damageTimer = 0;
  spawnParticles(p.x, p.y, 24, '#ff3b6b');
  Sfx.play('damage', 100);
  addFloat(p.x, p.y - 30, '-' + (amount * 0.5) + ' ❤', '#ff3b6b');
  for (const e of state.enemies) {
    const dx = e.x - p.x, dy = e.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < 220) { e.x += (dx/d) * 55; e.y += (dy/d) * 55; }
  }
  if (state.halfHearts <= 0) {
    state.halfHearts = 0;
    state.over = true;
    state.overTimer = 0;
    state.shake = 30;
    state.cam.zoom = 0.85;
    state.lasersFiring = [];
    spawnParticles(p.x, p.y, 60, '#4df3ff', 1.4);
  }
}

function gainXp(amount) {
  state.xp += amount;
  state.score += Math.round(amount * 2);
  let leveled = false;
  while (state.xp >= state.xpNeeded) {
    state.xp -= state.xpNeeded;
    state.level++;
    state.xpNeeded = Math.floor(state.xpNeeded * 1.35) + 4;
    leveled = true;
  }
  if (leveled) {
    state.levelTimer = 0;
    state.pendingLevelUps++;
    addFloat(state.player.x, state.player.y - 55, '¡NIVEL ' + state.level + '!', '#ffd54a');
    spawnParticles(state.player.x, state.player.y, 22, '#ffd54a', 1.1);
    state.cam.zoom = Math.min(1.18, state.cam.zoom + 0.08);
    Sfx.play('levelup');
    if (!state.cardChoices) openCardSelection();
  }
}

/* =============== CARTAS =============== */
function getRegenInfo(level) {
  if (level === 0) return { interval: 50, amount: 1 };
  const totalReduction = level - 1;
  const cycles = Math.floor(totalReduction / 50);
  const interval = 50 - (totalReduction % 50);
  const amount = 1 + cycles;
  return { interval, amount };
}

function pickRandomCards(n) {
  const allCards = [...CARD_TYPES, ...SPECIAL_CARDS];
  const pool = [...allCards];
  const picked = [];
  for (let i = 0; i < n && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}
function openCardSelection() {
  state.cardChoices = pickRandomCards(3);
  mouse.down = false;
  state.laserCharging = false;
  state.laserChargeTime = 0;
  Sfx.play('cardpop');
}
function applyCard(card) {
  const p = state.player;
  switch (card.id) {
    case 'fire': p.fireCdBase = Math.max(0.08, p.fireCdBase * 0.85); break;
    case 'multi': p.shots = Math.min(7, p.shots + 1); break;
    case 'health':
      state.maxHalfHearts = Math.min(24, state.maxHalfHearts + 1);
      state.halfHearts = Math.min(state.maxHalfHearts, state.halfHearts + 1);
      break;
    case 'speed': p.speed = Math.min(520, p.speed * 1.10); break;
    case 'back': p.backShots = Math.min(6, p.backShots + 1); break;
    case 'drone1': case 'drone2': case 'drone3': {
      const lines = card.id === 'drone1' ? 1 : (card.id === 'drone2' ? 2 : 3);
      state.drones.push({ lines, x: p.x, y: p.y, angle: 0, cd: 0.2 + Math.random() * 0.3, bob: Math.random() * TAU });
      break;
    }
    case 'magnet': state.magnetRange = Math.min(800, state.magnetRange + 80); break;
    case 'shield': state.shields.push({ hp: 4, maxHp: 4, x: p.x, y: p.y, angle: 0 }); break;
    case 'bounce': p.bounces = Math.min(6, p.bounces + 1); break;
    case 'homing': p.homingChance = Math.min(1, p.homingChance + 0.30); break;
    case 'dupli':
      p.dupliCount = Math.min(5, p.dupliCount + 1);
      p.dupliChance = Math.min(1, p.dupliCount * 0.10);
      break;
    case 'size': p.sizeLevel = Math.min(4, p.sizeLevel + 1); break;
    case 'dart':
      state.darts.push({ type: 'normal', x: p.x, y: p.y, vx: 0, vy: 0, angle: 0, state: 'follow', target: null, bob: Math.random() * TAU });
      break;
    case 'explosiveDart':
      state.darts.push({ type: 'explosive', x: p.x, y: p.y, vx: 0, vy: 0, angle: 0, state: 'follow', target: null, bob: Math.random() * TAU });
      break;
    case 'rayolaser': p.laserCount = Math.min(5, p.laserCount + 1); break;
    case 'lightning': p.lightningCount = Math.min(6, p.lightningCount + 1); break;
    case 'regen': {
      p.regenLevel++;
      const info = getRegenInfo(p.regenLevel);
      p.regenInterval = info.interval;
      p.regenAmount = info.amount;
      if (p.regenTimer <= 0) p.regenTimer = p.regenInterval;
      break;
    }
    case 'greed': p.greedLevel = Math.min(10, p.greedLevel + 1); break;
    case 'blink': {
      const sc = state.specialCards.blink;
      sc.totalCards++;
      sc.maxCharges++;
      sc.charges++;
      break;
    }
    case 'dash': {
      const sc = state.specialCards.dash;
      sc.totalCards++;
      sc.maxCharges++;
      sc.charges++;
      break;
    }
    case 'thunderRain': {
      const sc = state.specialCards.thunderRain;
      sc.totalCards++;
      sc.maxCharges++;
      sc.charges++;
      break;
    }
  }
}
function pickCard(card) {
  applyCard(card);
  state.pendingLevelUps--;
  state.cardChoices = null;
  state.cardRects = null;
  mouse.down = false;
  state.cam.zoom = Math.min(1.12, state.cam.zoom + 0.06);
  spawnParticles(state.player.x, state.player.y, 16, card.color, 0.9);
  Sfx.play('pick');
  addFloat(state.player.x, state.player.y - 55, card.name.toUpperCase(), card.color);
  if (state.pendingLevelUps > 0) {
    setTimeout(() => {
      if (!state.over && state.pendingLevelUps > 0 && !state.cardChoices && !state.inventoryOpen) openCardSelection();
    }, 260);
  }
}

/* =============== LÁSER =============== */
function fireLasers(holdTime) {
  const p = state.player;
  const count = p.laserCount;
  if (count === 0 || holdTime < 0.15) return;
  const width = 20 + holdTime * 25;
  const damage = width * 0.4;
  state.lasersFiring.push({
    startAngle: p.angle, sweep: 0, sweepSpeed: 6,
    width, damage, count, holdTime
  });
  state.shake = Math.min(state.shake + 8, 20);
  Sfx.play('laser', 300);
}

function updateLasersFiring(dt) {
  const p = state.player;
  const range = 2000;
  for (let i = state.lasersFiring.length - 1; i >= 0; i--) {
    const lf = state.lasersFiring[i];
    lf.sweep += lf.sweepSpeed * dt;
    if (lf.sweep >= TAU) { state.lasersFiring.splice(i, 1); continue; }
    for (let k = 0; k < lf.count; k++) {
      const angle = p.angle + lf.sweep + (k / lf.count) * TAU;
      for (let j = state.enemies.length - 1; j >= 0; j--) {
        const e = state.enemies[j];
        if (laserHits(e.x, e.y, e.size / 2, p.x, p.y, angle, lf.width, range)) {
          e.hp -= lf.damage * dt * state.playerDamageMult;
          e.hitFlash = 0.05;
          if (e.hp <= 0) killEnemy(j);
        }
      }
      if (state.boss) {
        const b = state.boss;
        if (laserHits(b.x, b.y, b.size / 2, p.x, p.y, angle, lf.width, range)) {
          b.hp -= lf.damage * dt * state.playerDamageMult;
          b.hitFlash = 0.05;
          if (b.hp <= 0) killBoss();
        }
        for (const ball of b.balls) {
          if (ball.state === 'attached') continue;
          if (laserHits(ball.x, ball.y, ball.r, p.x, p.y, angle, lf.width, range)) {
            b.hp -= lf.damage * dt * state.playerDamageMult * 0.5;
            if (b.hp <= 0) { killBoss(); break; }
          }
        }
      }
    }
  }
}

/* =============== EXPLOSIONES / MUERTE =============== */
function killEnemy(index) {
  const e = state.enemies[index];
  if (!e || e._dying) return;
  e._dying = true;
  if (e.type === 'dardante') state.enemyDarts = state.enemyDarts.filter(d => d.owner !== e);
  spawnParticles(e.x, e.y, 20, e.color, 1.1);
  spawnOrbs(e.x, e.y, e.xp);
  if (state.player.greedLevel > 0 && Math.random() < 0.15 * state.player.greedLevel) {
    spawnOrbs(e.x + rand(-30, 30), e.y + rand(-30, 30), e.xp * 0.7);
    addFloat(e.x, e.y - 25, '¡XP extra!', '#fbbf24');
  }
  state.kills++;
  state.score += Math.round(e.maxHp * 5);
  state.shake = Math.min(state.shake + 6, 16);
  state.cam.zoom = Math.min(1.15, state.cam.zoom + 0.04);
  Sfx.play('kill', 40);
  state.enemies.splice(index, 1);
  if (e.type === 'kamikaze') explodeKamikaze(e);
}

function explodeKamikaze(e) {
  const radius = 100;
  spawnParticles(e.x, e.y, 35, '#ef4444', 1.8);
  spawnParticles(e.x, e.y, 18, '#fbbf24', 1.2);
  state.shake = 18;
  state.flash = 0.15;
  state.flashRGB = '255,100,50';
  Sfx.play('explode', 60);
  const p = state.player;
  const ddx = p.x - e.x, ddy = p.y - e.y;
  if (ddx*ddx + ddy*ddy < radius*radius && p.invuln <= 0) damagePlayer(1);
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const other = state.enemies[i];
    const dx = other.x - e.x, dy = other.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < radius) {
      other.hp -= 2;
      other.hitFlash = 0.15;
      other.x += (dx/d) * 40;
      other.y += (dy/d) * 40;
      if (other.hp <= 0) killEnemy(i);
    }
  }
}

function summonEnemies(invoker) {
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * TAU + Math.random() * 0.4;
    const sx = invoker.x + Math.cos(a) * 45, sy = invoker.y + Math.sin(a) * 45;
    if (pointInWall(sx, sy, currentWalls)) continue;
    state.enemies.push(createEnemy(Math.random() < 0.5 ? 'normal' : 'fast', sx, sy));
  }
  spawnParticles(invoker.x, invoker.y, 30, '#8b5cf6', 1.3);
  state.shake = Math.min(state.shake + 8, 14);
}

/* =============== BOSS =============== */
function spawnBoss() {
  state.bossActive = true;
  state.bossWarningShown = false;
  const p = state.player;
  const aw = W / state.cam.zoom * 0.95;
  const ah = H / state.cam.zoom * 0.95;
  const ax = p.x - aw / 2, ay = p.y - ah / 2;
  state.arena = {
    x: ax, y: ay, w: aw, h: ah,
    walls: [
      { x: ax - 60, y: ay - 60, w: aw + 120, h: 60, isArena: true },
      { x: ax - 60, y: ay + ah, w: aw + 120, h: 60, isArena: true },
      { x: ax - 60, y: ay - 60, w: 60, h: ah + 120, isArena: true },
      { x: ax + aw, y: ay - 60, w: 60, h: ah + 120, isArena: true }
    ]
  };
  state.boss = {
    x: p.x, y: ay + 200,
    size: 180,
    hp: 1200, maxHp: 1200,
    color: '#ff2255', hitFlash: 0,
    state: 'idle', timer: 3, dashAngle: 0, phase: 1,
    balls: [
      { side: 'left',   x: 0, y: 0, r: 36, state: 'attached', vx: 0, vy: 0, life: 0 },
      { side: 'right',  x: 0, y: 0, r: 36, state: 'attached', vx: 0, vy: 0, life: 0 }
    ]
  };
  state.enemies = [];
  state.enemyDarts = [];
  state.enemyBullets = [];
  state.potions = [];
  state.bossBombs = [];
  state.bossLasers = [];
  state.bossLaserActive = false;
  state.bossLaserTimer = 0;
  addFloat(p.x, p.y - 100, '¡JEFE!', '#ff2255');
  state.shake = 25;
  state.flash = 0.5;
  state.flashRGB = '255,60,100';
  Sfx.play('bossroar');
}

function killBoss() {
  if (!state.boss) return;
  const b = state.boss;
  spawnParticles(b.x, b.y, 80, '#ff2255', 2);
  spawnParticles(b.x, b.y, 40, '#ffffff', 1.5);
  state.shake = 40;
  state.flash = 0.6;
  state.flashRGB = '255,60,100';
  state.score += 5000;
  state.kills++;
  addFloat(b.x, b.y - 60, '¡JEFE DERROTADO!', '#ffd54a');
  Sfx.play('bossdie');
  for (let i = 0; i < 25; i++) spawnOrbs(b.x + rand(-150, 150), b.y + rand(-150, 150), 6);
  for (let i = 0; i < 3; i++) {
    state.potions.push({ x: b.x + rand(-100, 100), y: b.y + rand(-100, 100), type: 'large', value: 2, life: 60, maxLife: 60, bob: Math.random() * TAU });
  }
  state.boss = null;
  state.bossActive = false;
  state.arena = null;
  state.bossBombs = [];
  state.bossLasers = [];
  state.bossLaserActive = false;
  state.bossSpawnTimer = 180;
}

function explodeBossBomb(bomb) {
  if (bomb.exploded) return;
  bomb.exploded = true;
  bomb.fadeTimer = 0;
  const radius = 100;
  spawnParticles(bomb.x, bomb.y, 30, '#ff8c42', 1.5);
  spawnParticles(bomb.x, bomb.y, 15, '#fbbf24', 1.0);
  state.shake = Math.max(state.shake, 14);
  Sfx.play('explode', 60);
  const p = state.player;
  if (p.invuln <= 0) {
    const dx = p.x - bomb.x, dy = p.y - bomb.y;
    if (dx*dx + dy*dy < radius*radius) damagePlayer(1);
  }
  for (const b2 of state.bossBombs) {
    if (b2 === bomb || b2.exploded) continue;
    const dx = b2.x - bomb.x, dy = b2.y - bomb.y;
    if (dx*dx + dy*dy < 130*130) b2.timer = Math.min(b2.timer, 0.35);
  }
}

function startBossAttack(type) {
  const b = state.boss;
  const p = state.player;
  if (type === 'dash') {
    b.state = 'dash_windup';
    b.timer = 0.7;
    b.dashAngle = Math.atan2(p.y - b.y, p.x - b.x);
  } else if (type === 'bombs') {
    b.state = 'attack';
    b.timer = 1.2;
    for (let i = 0; i < 6; i++) {
      let bx, by, tries = 0;
      do {
        bx = state.arena.x + 60 + Math.random() * (state.arena.w - 120);
        by = state.arena.y + 60 + Math.random() * (state.arena.h - 120);
        tries++;
        if (tries > 25) break;
      } while (Math.hypot(bx - p.x, by - p.y) < 140);
      state.bossBombs.push({ x: bx, y: by, r: 18, timer: 2.5 + i * 0.35, exploded: false, triggerTime: 0, fadeTimer: 0 });
    }
  } else if (type === 'balls') {
    b.state = 'attack';
    b.timer = 0.6;
    const ballSpeed = b.phase >= 2 ? 900 : 700;
    for (const ball of b.balls) {
      if (ball.state !== 'attached') continue;
      const a = Math.atan2(p.y - ball.y, p.x - ball.x);
      ball.state = 'flying';
      ball.vx = Math.cos(a) * ballSpeed;
      ball.vy = Math.sin(a) * ballSpeed;
      ball.life = 4;
    }
  } else if (type === 'laser') {
    b.state = 'attack';
    b.timer = 0.4;
    state.bossLaserTimer = 1.2;
  }
}
function getBossIdleTime() {
  if (state.boss.phase >= 3) return 0.9;
  if (state.boss.phase >= 2) return 1.3;
  return 1.9;
}

function updateBoss(dt) {
  const b = state.boss;
  if (!b) return;
  const p = state.player;

  if (b.hp < b.maxHp * 0.33 && b.phase < 3) {
    b.phase = 3;
    state.bossLaserActive = true;
    state.bossLaserTimer = 1.5;
    addFloat(b.x, b.y - 100, '¡FASE 3!', '#ff0000');
    state.shake = 25; state.flash = 0.4; state.flashRGB = '255,60,100';
    Sfx.play('bossroar', 200);
  } else if (b.hp < b.maxHp * 0.5 && b.phase < 2) {
    b.phase = 2;
    b.balls.push({ side: 'top', x: b.x, y: b.y, r: 36, state: 'attached', vx: 0, vy: 0, life: 0 });
    b.balls.push({ side: 'bottom', x: b.x, y: b.y, r: 36, state: 'attached', vx: 0, vy: 0, life: 0 });
    addFloat(b.x, b.y - 100, '¡FASE 2!', '#ff7700');
    state.shake = 18;
    Sfx.play('bossroar', 200);
  }

  const toPx = p.x - b.x, toPy = p.y - b.y;
  const dist = Math.hypot(toPx, toPy) || 1;

  if (b.state === 'idle') {
    b.x += (toPx / dist) * 60 * dt;
    b.y += (toPy / dist) * 60 * dt;
    b.timer -= dt;
    if (b.timer <= 0) {
      const attacks = ['dash', 'bombs', 'balls'];
      if (b.phase >= 3) attacks.push('laser');
      startBossAttack(attacks[Math.floor(Math.random() * attacks.length)]);
    }
  } else if (b.state === 'dash_windup') {
    b.timer -= dt;
    b.dashAngle = Math.atan2(toPy, toPx);
    if (b.timer <= 0) { b.state = 'dash'; b.timer = 0.55; Sfx.play('dash', 100); }
  } else if (b.state === 'dash') {
    b.timer -= dt;
    b.x += Math.cos(b.dashAngle) * 1600 * dt;
    b.y += Math.sin(b.dashAngle) * 1600 * dt;
    if (p.invuln <= 0) {
      const ddx = p.x - b.x, ddy = p.y - b.y;
      const rr = (b.size/2 + p.size/2);
      if (ddx*ddx + ddy*ddy < rr*rr) damagePlayer(2);
    }
    if (b.timer <= 0) { b.state = 'idle'; b.timer = getBossIdleTime(); }
  } else if (b.state === 'attack') {
    b.timer -= dt;
    if (b.timer <= 0) { b.state = 'idle'; b.timer = getBossIdleTime(); }
  }

  b.x = clamp(b.x, state.arena.x + b.size/2, state.arena.x + state.arena.w - b.size/2);
  b.y = clamp(b.y, state.arena.y + b.size/2, state.arena.y + state.arena.h - b.size/2);

  for (const ball of b.balls) {
    if (ball.state === 'attached') {
      if (ball.side === 'left') { ball.x = b.x - b.size/2 - ball.r; ball.y = b.y; }
      else if (ball.side === 'right') { ball.x = b.x + b.size/2 + ball.r; ball.y = b.y; }
      else if (ball.side === 'top') { ball.x = b.x; ball.y = b.y - b.size/2 - ball.r; }
      else if (ball.side === 'bottom') { ball.x = b.x; ball.y = b.y + b.size/2 + ball.r; }
    } else if (ball.state === 'flying') {
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      ball.life -= dt;
      if (ball.x - ball.r < state.arena.x) { ball.x = state.arena.x + ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > state.arena.x + state.arena.w) { ball.x = state.arena.x + state.arena.w - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < state.arena.y) { ball.y = state.arena.y + ball.r; ball.vy = Math.abs(ball.vy); }
      if (ball.y + ball.r > state.arena.y + state.arena.h) { ball.y = state.arena.y + state.arena.h - ball.r; ball.vy = -Math.abs(ball.vy); }
      if (p.invuln <= 0) {
        const ddx = p.x - ball.x, ddy = p.y - ball.y;
        const rr = ball.r + p.size/2;
        if (ddx*ddx + ddy*ddy < rr*rr) damagePlayer(1);
      }
      if (ball.life <= 0) ball.state = 'returning';
    } else if (ball.state === 'returning') {
      const dx = b.x - ball.x, dy = b.y - ball.y;
      const d = Math.hypot(dx, dy) || 1;
      ball.x += (dx/d) * 550 * dt;
      ball.y += (dy/d) * 550 * dt;
      if (d < 30) ball.state = 'attached';
    }
  }

  for (let i = state.bossBombs.length - 1; i >= 0; i--) {
    const bomb = state.bossBombs[i];
    if (bomb.exploded) {
      bomb.fadeTimer += dt;
      if (bomb.fadeTimer > 0.6) state.bossBombs.splice(i, 1);
      continue;
    }
    bomb.timer -= dt;
    const dx = p.x - bomb.x, dy = p.y - bomb.y;
    const triggerR = p.size/2 + bomb.r;
    if (dx*dx + dy*dy < triggerR*triggerR) bomb.timer = 0;
    if (bomb.timer <= 0) explodeBossBomb(bomb);
  }

  if (state.bossLaserActive) {
    state.bossLaserTimer -= dt;
    if (state.bossLaserTimer <= 0) {
      state.bossLaserTimer = 2.0;
      const edges = ['top', 'bottom', 'left', 'right'];
      const edge = edges[Math.floor(Math.random() * 4)];
      let lx, ly, la;
      if (edge === 'top') { lx = state.arena.x + Math.random() * state.arena.w; ly = state.arena.y; la = Math.PI/2 + rand(-0.6, 0.6); }
      else if (edge === 'bottom') { lx = state.arena.x + Math.random() * state.arena.w; ly = state.arena.y + state.arena.h; la = -Math.PI/2 + rand(-0.6, 0.6); }
      else if (edge === 'left') { lx = state.arena.x; ly = state.arena.y + Math.random() * state.arena.h; la = rand(-0.6, 0.6); }
      else { lx = state.arena.x + state.arena.w; ly = state.arena.y + Math.random() * state.arena.h; la = Math.PI + rand(-0.6, 0.6); }
      state.bossLasers.push({ x: lx, y: ly, angle: la, warmup: 1.0, active: 1.6, width: 70, state: 'warmup' });
    }
  }
  for (let i = state.bossLasers.length - 1; i >= 0; i--) {
    const ls = state.bossLasers[i];
    if (ls.state === 'warmup') {
      ls.warmup -= dt;
      if (ls.warmup <= 0) ls.state = 'active';
    } else {
      ls.active -= dt;
      if (ls.active <= 0) { state.bossLasers.splice(i, 1); continue; }
      if (p.invuln <= 0) {
        const dx = p.x - ls.x, dy = p.y - ls.y;
        const proj = dx * Math.cos(ls.angle) + dy * Math.sin(ls.angle);
        const perp = -dx * Math.sin(ls.angle) + dy * Math.cos(ls.angle);
        if (proj > 0 && Math.abs(perp) < ls.width/2 + p.size/2) damagePlayer(1);
      }
    }
  }
}

/* =============== ADAPTIVE =============== */
function checkAdaptive(dt) {
  if (state.bossActive) { state.adaptiveCheckTimer = 0; return; }
  state.adaptiveCheckTimer += dt;
  if (state.adaptiveCheckTimer < 15) return;
  state.adaptiveCheckTimer = 0;
  const levelSlow = state.levelTimer > 30;
  const noDamage = state.damageTimer > 22;
  if (!levelSlow && !noDamage) return;
  const r = Math.random();
  if (r < 0.40) {
    state.spawnRateMult = Math.max(0.55, state.spawnRateMult * 0.88);
    addFloat(state.player.x, state.player.y - 90, '¡MÁS ENEMIGOS!', '#ff5a6e');
  } else if (r < 0.72) {
    state.enemyHpMult = Math.min(2.5, state.enemyHpMult * 1.12);
    addFloat(state.player.x, state.player.y - 90, 'ENEMIGOS +VIDA', '#ff9a6e');
  } else {
    state.playerDamageMult = Math.max(0.5, state.playerDamageMult * 0.92);
    addFloat(state.player.x, state.player.y - 90, 'DAÑO -8%', '#fbbf24');
  }
  state.shake = Math.max(state.shake, 12);
  Sfx.play('explode', 400);
}

/* =============== LIGHTNING =============== */
function updateLightning(dt) {
  const p = state.player;
  if (p.lightningCount === 0) return;
  p.lightningCd -= dt;
  if (p.lightningCd > 0) return;
  p.lightningCd = 5;
  for (let n = 0; n < p.lightningCount; n++) {
    const targets = state.enemies;
    if (targets.length === 0 && !state.boss) break;
    let tx, ty;
    if (state.boss && Math.random() < 0.5) { tx = state.boss.x; ty = state.boss.y; }
    else if (targets.length > 0) { const e = targets[Math.floor(Math.random() * targets.length)]; tx = e.x; ty = e.y; }
    else break;
    state.lightningStrikes.push({ x: tx, y: ty, timer: 0.35, maxTimer: 0.35 });
    const radius = 80;
    for (let i = state.enemies.length - 1; i >= 0; i--) {
      const e2 = state.enemies[i];
      const ddx = e2.x - tx, ddy = e2.y - ty;
      if (ddx*ddx + ddy*ddy < radius*radius) {
        e2.hp -= 3 * state.playerDamageMult;
        e2.hitFlash = 0.15;
        if (e2.hp <= 0) killEnemy(i);
      }
    }
    if (state.boss) {
      const bdx = state.boss.x - tx, bdy = state.boss.y - ty;
      if (bdx*bdx + bdy*bdy < radius*radius) {
        state.boss.hp -= 3 * state.playerDamageMult;
        state.boss.hitFlash = 0.15;
        if (state.boss.hp <= 0) killBoss();
      }
    }
    spawnParticles(tx, ty, 20, '#fde047', 1.2);
    state.shake = Math.min(state.shake + 8, 16);
  }
  Sfx.play('lightning', 150);
}

/* =============== UPDATE =============== */
function update(dt) {
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const pt = state.particles[i];
    pt.life -= dt;
    if (pt.life <= 0) { state.particles.splice(i, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    const damp = Math.max(0, 1 - 5 * dt);
    pt.vx *= damp; pt.vy *= damp;
  }
  for (let i = state.floats.length - 1; i >= 0; i--) {
    const f = state.floats[i];
    f.life -= dt; f.y += f.vy * dt; f.vy *= 0.92;
    if (f.life <= 0) state.floats.splice(i, 1);
  }
  for (let i = state.lightningStrikes.length - 1; i >= 0; i--) {
    const ls = state.lightningStrikes[i];
    ls.timer -= dt;
    if (ls.timer <= 0) state.lightningStrikes.splice(i, 1);
  }
  if (state.shake > 0) state.shake = Math.max(0, state.shake - 45 * dt);
  if (state.flash > 0) state.flash = Math.max(0, state.flash - 2 * dt);

  const p = state.player;
  if (!state.over) {
    const targetCamX = p.x + p.vx * 0.16;
    const targetCamY = p.y + p.vy * 0.16;
    state.cam.x += (targetCamX - state.cam.x) * Math.min(1, 10 * dt);
    state.cam.y += (targetCamY - state.cam.y) * Math.min(1, 10 * dt);
  }
  state.cam.zoom += (1 - state.cam.zoom) * Math.min(1, 4.5 * dt);
  currentWalls = getVisibleChunks(state.cam);
  if (state.bossActive && state.arena) currentWalls = currentWalls.concat(state.arena.walls);

  if (state.over) { state.overTimer += dt; return; }
  if (state.cardChoices) return;
  if (state.inventoryOpen) return;

  state.time += dt;
  state.levelTimer += dt;
  state.damageTimer += dt;

  // Regeneración
  if (p.regenLevel > 0 && state.halfHearts < state.maxHalfHearts) {
    p.regenTimer -= dt;
    if (p.regenTimer <= 0) {
      state.halfHearts = Math.min(state.maxHalfHearts, state.halfHearts + p.regenAmount);
      p.regenTimer = p.regenInterval;
      addFloat(p.x, p.y - 40, '+' + (p.regenAmount * 0.5) + ' ❤', '#4ade80');
      spawnParticles(p.x, p.y, 15, '#4ade80', 0.8);
      Sfx.play('regen', 200);
    }
  } else if (p.regenLevel > 0) {
    p.regenTimer = p.regenInterval;
  }

  // Cooldowns de cartas especiales (genérico)
  for (const cid in state.specialCards) {
    const sc = state.specialCards[cid];
    if (sc.maxCharges > 0 && sc.charges < sc.maxCharges) {
      sc.cooldown -= dt;
      if (sc.cooldown <= 0) {
        sc.charges++;
        sc.cooldown = sc.cooldownMax;
      }
    }
  }

  // Thunder rain activa
  if (state.thunderRain.active) {
    state.thunderRain.timer -= dt;
    state.thunderRain.strikeTimer -= dt;
    if (state.thunderRain.strikeTimer <= 0) {
      state.thunderRain.strikeTimer = 0.35;
      let anyHit = false;
      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        if (isOnScreen(e.x, e.y)) {
          state.lightningStrikes.push({ x: e.x, y: e.y, timer: 0.3, maxTimer: 0.3 });
          e.hp -= 3 * state.playerDamageMult;
          e.hitFlash = 0.15;
          anyHit = true;
          if (e.hp <= 0) killEnemy(i);
        }
      }
      if (state.boss && isOnScreen(state.boss.x, state.boss.y)) {
        state.lightningStrikes.push({ x: state.boss.x, y: state.boss.y, timer: 0.3, maxTimer: 0.3 });
        state.boss.hp -= 3 * state.playerDamageMult;
        state.boss.hitFlash = 0.15;
        anyHit = true;
        if (state.boss.hp <= 0) killBoss();
      }
      if (anyHit) Sfx.play('lightning', 120);
    }
    if (state.thunderRain.timer <= 0) state.thunderRain.active = false;
  }

  if (!state.bossActive) {
    if (state.bossSpawnTimer > 0 && state.bossSpawnTimer < 5 && !state.bossWarningShown) {
      state.bossWarningShown = true;
      addFloat(p.x, p.y - 100, '¡JEFE EN CAMINO!', '#ff2255');
      state.shake = 10;
    }
    state.bossSpawnTimer -= dt;
    if (state.bossSpawnTimer <= 0) spawnBoss();
  }
  checkAdaptive(dt);

  // Movimiento (con dash)
  if (p.dashTimer > 0) {
    p.vx = Math.cos(p.dashAngle) * 1800;
    p.vy = Math.sin(p.dashAngle) * 1800;
    p.invuln = Math.max(p.invuln, 0.05);
    spawnParticles(p.x, p.y, 1, '#22d3ee', 0.7);
  } else {
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft'])  dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup'])    dy -= 1;
    if (keys['s'] || keys['arrowdown'])  dy += 1;
    const moving = (dx !== 0 || dy !== 0);
    if (moving) { const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
    const response = moving ? 16 : 11;
    const k = 1 - Math.exp(-response * dt);
    p.vx += (dx * p.speed - p.vx) * k;
    p.vy += (dy * p.speed - p.vy) * k;
  }
  const res = moveWithWalls(p, p.vx * dt, p.vy * dt, currentWalls);
  if (res.blockedX) p.vx = 0;
  if (res.blockedY) p.vy = 0;

  // Fin del dash
  if (p.dashTimer > 0) {
    p.dashTimer -= dt;
    if (p.dashTimer <= 0) {
      p.vx = 0; p.vy = 0;
      if (p.pendingDashes > 0 && state.specialCards.dash.charges > 0) {
        p.pendingDashes--;
        const target = getWorldMouse();
        p.dashAngle = Math.atan2(target.y - p.y, target.x - p.x);
        p.dashTimer = 0.25;
        p.invuln = Math.max(p.invuln, 0.3);
        state.specialCards.dash.charges--;
        if (state.specialCards.dash.cooldown <= 0) state.specialCards.dash.cooldown = state.specialCards.dash.cooldownMax;
        spawnParticles(p.x, p.y, 12, '#22d3ee', 1);
      } else {
        p.pendingDashes = 0;
      }
    }
  }

  const wm = getWorldMouse();
  p.angle = Math.atan2(wm.y - p.y, wm.x - p.x);
  if (p.invuln > 0) p.invuln -= dt;
  p.fireCd -= dt;

  // Disparo / carga láser
  if (mouse.down) {
    if (p.laserCount > 0) {
      state.laserCharging = true;
      state.laserChargeTime += dt;
      if (p.fireCd <= 0 && p.shots > 1) {
        shoot(p.shots - 1);
        p.fireCd = p.fireCdBase;
      }
    } else {
      if (p.fireCd <= 0) {
        shoot(p.shots);
        p.fireCd = p.fireCdBase;
      }
    }
  } else {
    if (state.laserCharging) {
      fireLasers(state.laserChargeTime);
      state.laserCharging = false;
      state.laserChargeTime = 0;
    }
  }
  updateLasersFiring(dt);

  updateLightning(dt);
  if (state.bossActive) updateBoss(dt);

  // Escudos
  const nShields = state.shields.length;
  for (let i = 0; i < nShields; i++) {
    const sh = state.shields[i];
    const baseAngle = (i / nShields) * TAU + state.time * 2.4;
    sh.angle = baseAngle;
    sh.x = p.x + Math.cos(baseAngle) * 50;
    sh.y = p.y + Math.sin(baseAngle) * 50;
  }

  // Balas jugador
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    if (b.homing) {
      const nearest = getNearestTarget(b.x, b.y);
      if (nearest) {
        const targetAngle = Math.atan2(nearest.y - b.y, nearest.x - b.x);
        const currentAngle = Math.atan2(b.vy, b.vx);
        let diff = targetAngle - currentAngle;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const newAngle = currentAngle + clamp(diff, -7.5*dt, 7.5*dt);
        const spd = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(newAngle) * spd; b.vy = Math.sin(newAngle) * spd;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.bullets.splice(i, 1); continue; }
    let removed = false;
    for (const w of currentWalls) {
      if (aabbOverlapCircle(b.x, b.y, b.r, w)) {
        if (b.dupli > 0) {
          reflectBulletOffWall(b, w);
          const newDupli = b.dupli - 1;
          b.dupli = newDupli;
          const spd = Math.hypot(b.vx, b.vy);
          const origAngle = Math.atan2(b.vy, b.vx);
          const copyAngle = origAngle + (Math.random() < 0.5 ? 0.4 : -0.4);
          spawnBullet(b.x, b.y, copyAngle, spd, {
            drone: b.drone, bounces: b.bounces, homing: b.homing,
            dupli: newDupli, damage: b.damage, radius: b.r
          });
          spawnParticles(b.x, b.y, 4, '#ff4dd2', 0.7);
        } else if (b.bounces > 0) {
          b.bounces--;
          reflectBulletOffWall(b, w);
          spawnParticles(b.x, b.y, 4, '#fbbf24', 0.6);
        } else {
          spawnParticles(b.x, b.y, 4, b.drone ? '#4dff88' : '#9ef7ff', 0.5);
          state.bullets.splice(i, 1);
          removed = true;
        }
        break;
      }
    }
    if (removed) continue;
  }

  // Balas enemigas
  for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
    const b = state.enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { state.enemyBullets.splice(i, 1); continue; }
    let hitWall = false;
    for (const w of currentWalls) if (aabbOverlapCircle(b.x, b.y, b.r, w)) { hitWall = true; break; }
    if (hitWall) {
      spawnParticles(b.x, b.y, 4, '#ff8c42', 0.5);
      state.enemyBullets.splice(i, 1);
    }
  }

  // Cancelación
  for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
    const eb = state.enemyBullets[i];
    let cancelled = false;
    for (let j = state.bullets.length - 1; j >= 0; j--) {
      const pb = state.bullets[j];
      const ddx = eb.x - pb.x, ddy = eb.y - pb.y;
      const rr = eb.r + pb.r + 1;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        spawnParticles((eb.x + pb.x)/2, (eb.y + pb.y)/2, 6, '#ffffff', 0.8);
        state.bullets.splice(j, 1);
        cancelled = true;
        break;
      }
    }
    if (cancelled) state.enemyBullets.splice(i, 1);
  }

  // Escudos bloquean
  for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
    const eb = state.enemyBullets[i];
    let blocked = false;
    for (let j = state.shields.length - 1; j >= 0; j--) {
      const sh = state.shields[j];
      const ddx = eb.x - sh.x, ddy = eb.y - sh.y;
      const rr = 14 + eb.r;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        sh.hp -= 1; blocked = true;
        spawnParticles(eb.x, eb.y, 6, '#4df3ff', 0.7);
        Sfx.play('shieldblock', 40);
        if (sh.hp <= 0) {
          spawnParticles(sh.x, sh.y, 18, '#4df3ff', 1.2);
          Sfx.play('shieldbreak', 80);
          state.shields.splice(j, 1);
        }
        break;
      }
    }
    if (blocked) state.enemyBullets.splice(i, 1);
  }

  // Escudos empujan
  for (const e of state.enemies) {
    if (e.type === 'juggernaut') continue;
    for (const sh of state.shields) {
      const ddx = e.x - sh.x, ddy = e.y - sh.y;
      const rr = 14 + e.size/2;
      const d2 = ddx*ddx + ddy*ddy;
      if (d2 < rr*rr) {
        const d = Math.sqrt(d2) || 1;
        e.x = sh.x + (ddx/d) * rr;
        e.y = sh.y + (ddy/d) * rr;
      }
    }
  }

  // Bala enemiga vs jugador
  for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
    const b = state.enemyBullets[i];
    if (p.invuln <= 0) {
      const ddx = p.x - b.x, ddy = p.y - b.y;
      const rr = p.size/2 + b.r;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        damagePlayer(1);
        state.enemyBullets.splice(i, 1);
      }
    }
  }

  // Spawn
  if (!state.bossActive) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      const interval = Math.max(0.55, 1.7 - state.time * 0.009) * state.spawnRateMult;
      state.spawnTimer = interval * rand(0.80, 1.25);
    }
    state.potionTimer -= dt;
    if (state.potionTimer <= 0) {
      spawnPotion(currentWalls);
      state.potionTimer = 12 + Math.random() * 12;
    }
  }

  // IA enemigos
  const despawnDist = Math.max(W, H) * 1.0 + 900;
  for (let i = state.enemies.length - 1; i >= 0; i--) {
    const e = state.enemies[i];
    const toPx = p.x - e.x, toPy = p.y - e.y;
    const distToPlayer = Math.hypot(toPx, toPy) || 1;

    if (e.type === 'shooter') {
      const dirX = toPx / distToPlayer, dirY = toPy / distToPlayer;
      const desired = 340;
      let mvx = 0, mvy = 0;
      if (distToPlayer > desired + 40) { mvx += dirX; mvy += dirY; }
      else if (distToPlayer < desired - 40) { mvx -= dirX; mvy -= dirY; }
      else { mvx += -dirY * 0.7; mvy += dirX * 0.7; }
      for (const b of state.bullets) {
        const bdx = e.x - b.x, bdy = e.y - b.y;
        const bd2 = bdx*bdx + bdy*bdy;
        if (bd2 < 180*180) {
          const vlen = Math.hypot(b.vx, b.vy) || 1;
          const perpX = -b.vy / vlen, perpY = b.vx / vlen;
          const dot = bdx * perpX + bdy * perpY;
          const sign = dot > 0 ? 1 : -1;
          const strength = (1 - Math.sqrt(bd2)/180) * 1.8;
          mvx += perpX * sign * strength;
          mvy += perpY * sign * strength;
        }
      }
      const mlen = Math.hypot(mvx, mvy);
      if (mlen > 0.001) { mvx /= mlen; mvy /= mlen; }
      e.wob += dt * 3.2;
      moveWithWalls(e, mvx * e.speed * dt, mvy * e.speed * dt, currentWalls);
      e.shootCd -= dt;
      if (e.shootCd <= 0 && distToPlayer < 560) {
        let hasLos = true;
        for (let s = 1; s < 10; s++) {
          if (pointInWall(e.x + toPx * (s/10), e.y + toPy * (s/10), currentWalls)) { hasLos = false; break; }
        }
        if (hasLos) {
          const a = Math.atan2(toPy, toPx);
          state.enemyBullets.push({ x: e.x + Math.cos(a)*20, y: e.y + Math.sin(a)*20, vx: Math.cos(a)*400, vy: Math.sin(a)*400, r: 6, life: 3 });
          e.shootCd = 1.4 + Math.random() * 0.7;
          Sfx.play('enemyshoot', 80);
        }
      }
    } else if (e.type === 'invoker') {
      const dirX = toPx / distToPlayer, dirY = toPy / distToPlayer;
      const desired = 320;
      let mvx = 0, mvy = 0;
      if (distToPlayer < desired - 30) { mvx -= dirX; mvy -= dirY; }
      else if (distToPlayer > desired + 30) { mvx += dirX; mvy += dirY; }
      e.wob += dt * 2;
      mvx += -dirY * Math.sin(e.wob) * 0.4;
      mvy += dirX * Math.sin(e.wob) * 0.4;
      const ml = Math.hypot(mvx, mvy) || 1;
      moveWithWalls(e, (mvx/ml) * e.speed * dt, (mvy/ml) * e.speed * dt, currentWalls);
      e.shootCd -= dt;
      if (e.shootCd <= 0) { summonEnemies(e); e.shootCd = 5 + Math.random() * 2; Sfx.play('teleport', 150); }
    } else if (e.type === 'teleporter') {
      const dirX = toPx / distToPlayer, dirY = toPy / distToPlayer;
      e.wob += dt * 4;
      moveWithWalls(e, dirX * e.speed * dt, dirY * e.speed * dt, currentWalls);
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        for (let attempt = 0; attempt < 8; attempt++) {
          const a = Math.random() * TAU;
          const dist = 280 + Math.random() * 160;
          const nx = p.x + Math.cos(a) * dist, ny = p.y + Math.sin(a) * dist;
          if (!pointInWall(nx, ny, currentWalls)) {
            spawnParticles(e.x, e.y, 15, '#06b6d4', 1);
            e.x = nx; e.y = ny;
            spawnParticles(e.x, e.y, 15, '#06b6d4', 1);
            Sfx.play('teleport', 60);
            break;
          }
        }
        e.shootCd = 3 + Math.random() * 2;
      }
    } else if (e.type === 'kamikaze') {
      const dirX = toPx / distToPlayer, dirY = toPy / distToPlayer;
      moveWithWalls(e, dirX * e.speed * dt, dirY * e.speed * dt, currentWalls);
      if (distToPlayer < 55) { killEnemy(i); continue; }
    } else if (e.type === 'dardante') {
      const dirX = toPx / distToPlayer, dirY = toPy / distToPlayer;
      const desired = 250;
      let mvx = 0, mvy = 0;
      if (distToPlayer < desired - 30) { mvx -= dirX; mvy -= dirY; }
      else if (distToPlayer > desired + 30) { mvx += dirX; mvy += dirY; }
      e.wob += dt * 2;
      mvx += -dirY * Math.sin(e.wob) * 0.5;
      mvy += dirX * Math.sin(e.wob) * 0.5;
      const ml = Math.hypot(mvx, mvy) || 1;
      moveWithWalls(e, (mvx/ml) * e.speed * dt, (mvy/ml) * e.speed * dt, currentWalls);
      e.shootCd -= dt;
      const activeCount = state.enemyDarts.filter(d => d.owner === e).length;
      if (e.shootCd <= 0 && activeCount < 4 && distToPlayer < 500) {
        const a = Math.atan2(toPy, toPx);
        state.enemyDarts.push({
          x: e.x + Math.cos(a) * (e.size/2 + 8),
          y: e.y + Math.sin(a) * (e.size/2 + 8),
          vx: Math.cos(a) * 220, vy: Math.sin(a) * 220,
          angle: a, owner: e
        });
        e.shootCd = 1.6 + Math.random() * 0.4;
        Sfx.play('enemyshoot', 80);
      }
    } else if (e.type === 'juggernaut') {
      if (e.jState === 'idle') {
        e.jTimer -= dt;
        if (e.jTimer <= 0 && distToPlayer < 900) {
          e.jState = 'charging';
          e.jTimer = 0.75;
          e.jAngle = Math.atan2(toPy, toPx);
          e.jHit = false;
          Sfx.play('dash', 200);
        }
      } else if (e.jState === 'charging') {
        e.jTimer -= dt;
        e.jAngle = Math.atan2(toPy, toPx);
        if (e.jTimer <= 0) { e.jState = 'dashing'; e.jTimer = 0.6; Sfx.play('dash', 100); }
      } else if (e.jState === 'dashing') {
        e.jTimer -= dt;
        const res2 = moveWithWalls(e, Math.cos(e.jAngle) * 1800 * dt, Math.sin(e.jAngle) * 1800 * dt, currentWalls);
        if (!e.jHit && p.invuln <= 0) {
          const ddx = p.x - e.x, ddy = p.y - e.y;
          const rr = (e.size + p.size) * 0.5;
          if (ddx*ddx + ddy*ddy < rr*rr) { damagePlayer(2); e.jHit = true; }
        }
        if (e.jTimer <= 0 || res2.blockedX || res2.blockedY) { e.jState = 'recover'; e.jTimer = 1.0; }
      } else if (e.jState === 'recover') {
        e.jTimer -= dt;
        if (e.jTimer <= 0) { e.jState = 'idle'; e.jTimer = 3.2 + Math.random() * 1.5; }
      }
    } else {
      let ax = toPx / distToPlayer, ay = toPy / distToPlayer;
      e.wob += dt * 3.2;
      const perp = Math.sin(e.wob) * 0.25;
      let nx = ax - ay * perp, ny = ay + ax * perp;
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      moveWithWalls(e, nx * e.speed * dt, ny * e.speed * dt, currentWalls);
    }
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (distToPlayer > despawnDist) state.enemies.splice(i, 1);
  }

  // Separación
  for (let i = 0; i < state.enemies.length; i++) {
    for (let j = i + 1; j < state.enemies.length; j++) {
      const a = state.enemies[i], b = state.enemies[j];
      if (a.type === 'juggernaut' || b.type === 'juggernaut') continue;
      const ddx = b.x - a.x, ddy = b.y - a.y;
      const minD = (a.size + b.size) * 0.5;
      const d2 = ddx*ddx + ddy*ddy;
      if (d2 > 0.001 && d2 < minD*minD) {
        const dd = Math.sqrt(d2);
        const push = (minD - dd) * 0.5;
        const ux = ddx/dd, uy = ddy/dd;
        a.x -= ux*push; a.y -= uy*push;
        b.x += ux*push; b.y += uy*push;
      }
    }
  }

  // Bala jugador vs enemigo
  for (let i = state.bullets.length - 1; i >= 0; i--) {
    const b = state.bullets[i];
    let hit = false, bounceKept = false;
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const e = state.enemies[j];
      const ddx = b.x - e.x, ddy = b.y - e.y;
      const rr = e.size/2 + b.r;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        e.hp -= b.damage * state.playerDamageMult;
        e.hitFlash = 0.12;
        hit = true;
        spawnParticles(b.x, b.y, 5, e.color, 0.6);
        if (e.hp <= 0) killEnemy(j);
        else Sfx.play('hit', 25);
        const d = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
        const nx = ddx/d, ny = ddy/d;
        if (b.dupli > 0) {
          const dot = b.vx*nx + b.vy*ny;
          b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
          b.x = e.x + nx*(e.size/2 + b.r + 1);
          b.y = e.y + ny*(e.size/2 + b.r + 1);
          const newDupli = b.dupli - 1;
          b.dupli = newDupli;
          const spd = Math.hypot(b.vx, b.vy);
          const origAngle = Math.atan2(b.vy, b.vx);
          const copyAngle = origAngle + (Math.random() < 0.5 ? 0.4 : -0.4);
          spawnBullet(b.x, b.y, copyAngle, spd, {
            drone: b.drone, bounces: b.bounces, homing: b.homing,
            dupli: newDupli, damage: b.damage, radius: b.r
          });
          spawnParticles(b.x, b.y, 4, '#ff4dd2', 0.7);
          bounceKept = true;
        } else if (b.bounces > 0) {
          b.bounces--;
          const dot = b.vx*nx + b.vy*ny;
          b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
          b.x = e.x + nx*(e.size/2 + b.r + 1);
          b.y = e.y + ny*(e.size/2 + b.r + 1);
          spawnParticles(b.x, b.y, 4, '#fbbf24', 0.6);
          bounceKept = true;
        }
        break;
      }
    }
    if (hit && !bounceKept) state.bullets.splice(i, 1);
  }

  // Balas vs boss
  if (state.boss) {
    const b0 = state.boss;
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      const ddx = b.x - b0.x, ddy = b.y - b0.y;
      const rr = b0.size/2 + b.r;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        b0.hp -= b.damage * state.playerDamageMult;
        b0.hitFlash = 0.1;
        spawnParticles(b.x, b.y, 5, '#ff2255', 0.6);
        if (b.bounces > 0) {
          b.bounces--;
          const d = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
          const nx = ddx/d, ny = ddy/d;
          const dot = b.vx*nx + b.vy*ny;
          b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
          b.x = b0.x + nx * (b0.size/2 + b.r + 1);
          b.y = b0.y + ny * (b0.size/2 + b.r + 1);
        } else {
          state.bullets.splice(i, 1);
        }
        if (b0.hp <= 0) { killBoss(); break; }
      }
    }
    if (state.boss) {
      for (const ball of state.boss.balls) {
        if (ball.state === 'attached') continue;
        for (let i = state.bullets.length - 1; i >= 0; i--) {
          const b = state.bullets[i];
          const ddx = b.x - ball.x, ddy = b.y - ball.y;
          const rr = ball.r + b.r;
          if (ddx*ddx + ddy*ddy < rr*rr) {
            state.boss.hp -= b.damage * state.playerDamageMult * 0.5;
            state.boss.hitFlash = 0.1;
            spawnParticles(b.x, b.y, 5, '#ff2255', 0.6);
            if (b.bounces > 0) {
              b.bounces--;
              const d = Math.sqrt(ddx*ddx + ddy*ddy) || 1;
              const nx = ddx/d, ny = ddy/d;
              const dot = b.vx*nx + b.vy*ny;
              b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
              b.x = ball.x + nx * (ball.r + b.r + 1);
              b.y = ball.y + ny * (ball.r + b.r + 1);
            } else {
              state.bullets.splice(i, 1);
            }
            if (state.boss && state.boss.hp <= 0) { killBoss(); break; }
          }
        }
        if (!state.boss) break;
      }
    }
  }

  // Dardos enemigos
  for (let i = state.enemyDarts.length - 1; i >= 0; i--) {
    const d = state.enemyDarts[i];
    if (d.owner && state.enemies.indexOf(d.owner) === -1) { state.enemyDarts.splice(i, 1); continue; }
    const ang = Math.atan2(p.y - d.y, p.x - d.x);
    d.vx += Math.cos(ang) * 400 * dt;
    d.vy += Math.sin(ang) * 400 * dt;
    const spd = Math.hypot(d.vx, d.vy);
    if (spd > 240) { d.vx = d.vx/spd*240; d.vy = d.vy/spd*240; }
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.angle = Math.atan2(d.vy, d.vx);
    if (p.invuln <= 0) {
      const ddx = p.x - d.x, ddy = p.y - d.y;
      const rr = p.size/2 + 6;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        damagePlayer(1);
        state.enemyDarts.splice(i, 1);
      }
    }
  }

  // Orbes
  for (let i = state.orbs.length - 1; i >= 0; i--) {
    const o = state.orbs[i];
    o.life -= dt; o.pulse += dt * 6;
    if (o.life <= 0) { state.orbs.splice(i, 1); continue; }
    const ddx = p.x - o.x, ddy = p.y - o.y;
    const d2 = ddx*ddx + ddy*ddy;
    const d = Math.sqrt(d2) || 1;
    const mr = state.magnetRange;
    if (d < mr) {
      const str = 1800 * (1 - d/mr);
      o.vx += (ddx/d) * str * dt;
      o.vy += (ddy/d) * str * dt;
    }
    const friction = Math.max(0, 1 - 3*dt);
    o.vx *= friction; o.vy *= friction;
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (d < p.size/2 + o.r + 6) {
      gainXp(o.value);
      Sfx.play('pickup', 20);
      spawnParticles(o.x, o.y, 4, '#8fff9e', 0.5);
      state.orbs.splice(i, 1);
    }
  }

  // Pociones
  for (let i = state.potions.length - 1; i >= 0; i--) {
    const pot = state.potions[i];
    pot.life -= dt; pot.bob += dt * 4;
    if (pot.life <= 0) { state.potions.splice(i, 1); continue; }
    const ddx = p.x - pot.x, ddy = p.y - pot.y;
    const rr = p.size/2 + 16;
    if (state.halfHearts < state.maxHalfHearts && ddx*ddx + ddy*ddy < rr*rr) {
      const before = state.halfHearts;
      state.halfHearts = Math.min(state.maxHalfHearts, state.halfHearts + pot.value);
      const gained = state.halfHearts - before;
      if (gained > 0) {
        Sfx.play('potion');
        spawnParticles(pot.x, pot.y, 22, pot.type === 'large' ? '#ff9ec4' : '#ff7aa8', 1);
        addFloat(pot.x, pot.y - 20, '+' + (gained*0.5) + ' ❤', '#ff7aa8');
        state.cam.zoom = Math.min(1.1, state.cam.zoom + 0.03);
      }
      state.potions.splice(i, 1);
    }
  }

  // Enemigo vs jugador
  if (p.invuln <= 0) {
    for (const e of state.enemies) {
      if (e.type === 'kamikaze') continue;
      if (e.type === 'juggernaut' && e.jState !== 'dashing') continue;
      const ddx = p.x - e.x, ddy = p.y - e.y;
      const rr = (e.size + p.size) * 0.5;
      if (ddx*ddx + ddy*ddy < rr*rr) { damagePlayer(1); break; }
    }
  }

  // Drones
  if (state.drones.length > 0) {
    const N = state.drones.length;
    const baseR = 62 + Math.max(0, (N - 6) * 3);
    for (let i = 0; i < N; i++) {
      const d = state.drones[i];
      d.bob += dt * 3.5;
      const orbitAngle = (i / N) * TAU + TAU * 0.25 + Math.sin(d.bob * 0.4) * 0.05;
      const orbitR = baseR + Math.sin(d.bob) * 3;
      const tx = p.x + Math.cos(orbitAngle) * orbitR;
      const ty = p.y + Math.sin(orbitAngle) * orbitR;
      const kf = 1 - Math.exp(-9 * dt);
      d.x += (tx - d.x) * kf;
      d.y += (ty - d.y) * kf;
      const nearest = getNearestTarget(d.x, d.y);
      if (nearest) {
        d.angle = Math.atan2(nearest.y - d.y, nearest.x - d.x);
        d.cd -= dt;
        if (d.cd <= 0) {
          const n = d.lines, spread = 0.10;
          const total = (n - 1) * spread;
          const baseRadius = 4 + p.sizeLevel * 1.2;
          const baseDamage = 1 + Math.floor(p.sizeLevel * 0.75);
          for (let j = 0; j < n; j++) {
            const a = d.angle - total/2 + j*spread + (Math.random() - 0.5) * 0.02;
            const isHoming = Math.random() < p.homingChance;
            const isDupli = Math.random() < p.dupliChance;
            spawnBullet(d.x + Math.cos(a)*10, d.y + Math.sin(a)*10, a, 820, {
              drone: true, bounces: p.bounces, homing: isHoming,
              dupli: isDupli ? p.dupliCount : 0,
              damage: baseDamage, radius: baseRadius
            });
          }
          d.cd = 0.5 + 0.10 * d.lines;
          Sfx.play('shoot', 70);
        }
      }
    }
  }

  // Dardos jugador
  for (let i = 0; i < state.darts.length; i++) {
    const d = state.darts[i];
    if (d.target) {
      const stillValid = (state.enemies.indexOf(d.target) !== -1) || isBossOrBall(d.target);
      if (!stillValid) { d.target = null; d.state = 'return'; }
    }
    if (d.state === 'follow') {
      const nearest = getNearestTarget(d.x, d.y);
      let dist2 = Infinity;
      if (nearest) dist2 = (nearest.x - d.x)**2 + (nearest.y - d.y)**2;
      if (nearest && dist2 < 450*450) { d.target = nearest; d.state = 'hunt'; }
      else {
        d.bob += dt * 3;
        const baseAngle = (i / Math.max(1, state.darts.length)) * TAU + state.time * 1.5;
        const tx = p.x + Math.cos(baseAngle) * 45;
        const ty = p.y + Math.sin(baseAngle) * 45;
        d.x += (tx - d.x) * Math.min(1, 12*dt);
        d.y += (ty - d.y) * Math.min(1, 12*dt);
        d.angle = baseAngle + Math.PI/2;
      }
    } else if (d.state === 'hunt' && d.target) {
      const ang = Math.atan2(d.target.y - d.y, d.target.x - d.x);
      d.angle = ang;
      d.x += Math.cos(ang) * 650 * dt;
      d.y += Math.sin(ang) * 650 * dt;
      const targetRadius = d.target.size !== undefined ? d.target.size/2 : (d.target.r || 20);
      const ddx = d.x - d.target.x, ddy = d.y - d.target.y;
      const rr = targetRadius + 6;
      if (ddx*ddx + ddy*ddy < rr*rr) {
        const targetIsBoss = isBossOrBall(d.target);
        if (d.type === 'explosive') {
          const radius = 90;
          spawnParticles(d.x, d.y, 30, '#fb7185', 1.5);
          state.shake = 14;
          Sfx.play('explode', 80);
          for (let j = state.enemies.length - 1; j >= 0; j--) {
            const e2 = state.enemies[j];
            const edx = e2.x - d.x, edy = e2.y - d.y;
            if (edx*edx + edy*edy < radius*radius) {
              e2.hp -= 3 * state.playerDamageMult;
              e2.hitFlash = 0.15;
              if (e2.hp <= 0) killEnemy(j);
            }
          }
          if (state.boss) {
            const edx = state.boss.x - d.x, edy = state.boss.y - d.y;
            if (edx*edx + edy*edy < radius*radius) {
              state.boss.hp -= 3 * state.playerDamageMult;
              if (state.boss.hp <= 0) killBoss();
            }
